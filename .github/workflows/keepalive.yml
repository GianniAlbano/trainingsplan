# Hält das kostenlose Supabase-Projekt aktiv (Supabase pausiert es nach ca. 7 Tagen ohne Nutzung).
# Läuft alle 3 Tage um 06:17 UTC und lässt sich unter "Actions" auch von Hand starten.
# URL und Publishable key werden aus config.js gelesen, es muss nichts extra eingetragen werden.
name: Supabase wach halten

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Repository holen
        uses: actions/checkout@v5

      - name: Supabase anpingen
        run: |
          # nur die Zeilen mit den echten Werten lesen, nicht die Beispiele in den Kommentaren
          URL=$(grep -E '^[[:space:]]*supabaseUrl:' config.js | grep -oE 'https://[a-z0-9]+\.supabase\.co' | head -n1)
          KEY=$(grep -E '^[[:space:]]*supabaseKey:' config.js | grep -oE 'sb_publishable_[A-Za-z0-9_-]+' | head -n1)
          echo "Projekt: $URL"
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "In config.js fehlen supabaseUrl oder supabaseKey."
            exit 1
          fi
          CODE=$(curl -sS -o antwort.txt -w '%{http_code}' -X POST "$URL/rest/v1/rpc/keepalive" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}')
          echo "Antwort von Supabase: $CODE $(cat antwort.txt)"
          if [ "$CODE" != "200" ]; then
            echo "Supabase hat nicht mit 200 geantwortet. Ist das Projekt pausiert oder fehlt die Funktion keepalive (supabase/keepalive.sql)?"
            exit 1
          fi

// Titel ergibt sich aus der Art; Intervalle aus Anzahl × Strecke
function autoTitle(){
  if ($("f_type").value === "interval"){ const n = +$("f_reps").value, m = +$("f_repDist").value; if (n && m) return `${n} × ${m} m`; }
  return "";
}
function syncTitle(){ if (!editing || !$("planEdit").hidden) $("dlgTitle").textContent = autoTitle() || TYPES[$("f_type").value]?.label || "Einheit"; }
["f_reps","f_repDist"].forEach(id => $(id).addEventListener("input", syncTitle));
function applyKind(){
  const t = $("f_type").value, nr = isNonrun();
  $("form").classList.toggle("nonrun", nr);
  $("form").classList.toggle("isint", t === "interval");
  $("form").style.setProperty("--tc", `var(--t-${t})`);
  $("sChip").textContent = TYPES[t]?.label || ""; $("sChip").style.setProperty("--tc", `var(--t-${t})`);
  $("timeLbl").textContent = nr ? "Dauer (h:mm)" : "Zeit (h:mm:ss)";
  $("f_time").placeholder = nr ? "1:30" : "0:52:30";
  $("f_time").dataset.mask = nr ? "hm" : "hms";
  $("moreSum").textContent = nr ? "Notiz" : "Puls & Notiz";
}
$("f_zone").onchange = () => { zoneTouched = true; syncPlan(); };
$("f_type").onchange = () => {
  applyKind(); syncTitle();
  if (!zoneTouched && !editing && mpSec()) $("f_zone").value = TYPE_ZONE[$("f_type").value] || "";
  syncPlan();
};
$("f_planKm").oninput = () => { if ($("f_zone").value && zonePace($("f_zone").value)) { syncPlan(); return; }
  const km = kmv("f_planKm"), mn = +$("f_planMin").value, p = parseTime($("f_planPace").value);
  if (km && paceTouched && p) $("f_planMin").value = Math.round(km*p/60); else if (km && mn) $("f_planPace").value = fmtPaceSec(mn*60/km); };
$("f_planMin").oninput = () => { const km = kmv("f_planKm"), mn = +$("f_planMin").value; paceTouched = false; if (km && mn) $("f_planPace").value = fmtPaceSec(mn*60/km); };
$("f_planPace").oninput = () => { paceTouched = true; const km = kmv("f_planKm"), p = parseTime($("f_planPace").value); if (km && p && $("f_planPace").value.includes(":")) $("f_planMin").value = Math.round(km*p/60); updatePace(); };
function updatePace(){
  const km = kmv("f_km"), sec = parseTime($("f_time").value);
  $("paceOut").textContent = fmtPace(sec,km);
  const target = parseTime($("f_planPace").value);
  if (sec && km && target){ const diff = Math.round(sec/km - target); $("paceCmp").textContent = diff===0 ? "genau im Ziel" : `${diff<0?"":"+"}${diff} s ggü. Zielpace`; }
  else $("paceCmp").textContent = "";
}
function planSummary(s){
  if (NONRUN.has(s.type)) return planMinutes(s) ? `<span>${planMinutes(s)} min</span>` : `<span class="muted">Keine Dauer geplant</span>`;
  const pp = planPace(s), pm = planMinutes(s), zoned = s.planZone && zonePace(s.planZone);
  const parts = [s.planKm ? `<span>${fmtKm(s.planKm)} km</span>` : "", pm ? `<span>${zoned?"~":""}${pm} min</span>` : "",
    pp ? `<span>${fmtPaceSec(pp)} /km</span>` : "", zoned ? `<span class="zone" style="--tc:var(--t-${ZONES[s.planZone].tc})">${ZONES[s.planZone].label}</span>` : ""].join("");
  return parts || `<span class="muted">Keine Planwerte</span>`;
}
function showPlanEdit(on){ $("planEdit").hidden = !on; $("planView").hidden = on; }
$("editPlan").onclick = () => showPlanEdit(true);

function openSession(id, date, logNow){
  const s = id ? state.sessions.get(id) : null;
  editing = id || null; delArmed = false; paceTouched = !!s?.planPace; zoneTouched = !!s;
  const dt = parse(s?.date || date || iso(today()));
  $("dlgTitle").textContent = s ? (s.title || TYPES[s.type]?.label || "Einheit") : TYPES.easy.label;
  $("sSub").textContent = dt.toLocaleDateString("de-DE", {weekday:"long", day:"numeric", month:"long"});
  $("f_date").value = iso(dt);
  $("f_type").value = s?.type || "easy";
  const rp = s?.title && /(\d+)\s*[×x]\s*(\d+)\s*m/i.exec(s.title);
  $("f_reps").value = s?.planReps ?? (rp ? rp[1] : "");
  $("f_repDist").value = s?.planRepDist ?? (rp ? rp[2] : "");
  $("f_planKm").value = decStr(s?.planKm);
  $("f_planMin").value = s ? (planMinutes(s) ?? "") : "";
  $("f_planPace").value = s ? fmtPaceSec(s.planPace || (s.planKm && s.planMin ? s.planMin*60/s.planKm : 0)) : "";
  $("f_desc").value = s?.desc || "";
  fillZones();
  $("f_zone").value = s ? (mpSec() && s.planZone ? s.planZone : "") : (mpSec() ? TYPE_ZONE.easy : "");
  applyKind(); syncPlan();
  // Bestehende Einheit: Plan als kurze Zusammenfassung, Bearbeiten auf Wunsch
  if (s){ $("pvKv").innerHTML = planSummary(s); $("pvDesc").textContent = s.desc || ""; }
  showPlanEdit(!s);
  const a = s?.actual;
  $("f_done").checked = !!a || !!logNow;
  $("logFields").hidden = !$("f_done").checked; $("form").classList.toggle("logging", $("f_done").checked);
  $("f_km").value = decStr(a?.km ?? (logNow && s?.planKm && !NONRUN.has(s.type) ? s.planKm : null));
  $("f_time").value = a?.sec ? (NONRUN.has(s.type) ? fmtHM(a.sec) : fmtHMS(a.sec))
    : (logNow && s && NONRUN.has(s.type) && planMinutes(s) ? fmtHM(planMinutes(s)*60) : "");
  $("f_hr").value = a?.hr ?? "";
  rpe = a?.rpe ?? null; syncRpe();
  feel = a?.feel ?? null; syncFeel();
  $("f_notes").value = a?.notes || "";
  $("moreDet").open = !!(a?.hr || a?.notes);
  $("delBtn").hidden = !s; $("delBtn").textContent = "Löschen"; $("delBtn").classList.remove("armed");
  $("formErr").hidden = true;
  updatePace();
  $("dlg").showModal();
  $("dlgTitle").focus({preventScroll:true});
  $("form").scrollTop = 0; $("dlg").scrollTop = 0;
}
$("cancelBtn").onclick = () => $("dlg").close();
$("xBtn").onclick = () => $("dlg").close();
$("delBtn").onclick = async () => {
  if (!delArmed){ delArmed = true; $("delBtn").textContent = "Wirklich löschen?"; $("delBtn").classList.add("armed"); return; }
  try { await store.remove(editing); $("dlg").close(); toast("Einheit gelöscht"); } catch(e){ showErr("Löschen hat nicht geklappt. Prüfe deine Verbindung und versuche es noch einmal."); }
};
function showErr(m){ $("formErr").textContent = m; $("formErr").hidden = false; }
$("form").onsubmit = async e => {
  e.preventDefault();
  const date = $("f_date").value; if (!date){ showPlanEdit(true); showErr("Bitte ein Datum wählen."); return; }
  const prev = editing ? state.sessions.get(editing) : null, nr = isNonrun();
  const zone = nr ? null : ($("f_zone").value || (!mpSec() && prev?.planZone) || null);
  const pRaw = $("f_planPace").value.trim(), pSec = parseTime(pRaw);
  if (!nr && !zone && pRaw && (!pSec || !pRaw.includes(":"))){ showPlanEdit(true); showErr("Pace bitte als m:ss eingeben, z. B. 5:30."); return; }
  const body = {
    date, type: $("f_type").value, title: autoTitle() || (prev && prev.type === $("f_type").value ? prev.title || "" : ""),
    planReps: $("f_type").value==="interval" && $("f_reps").value ? +$("f_reps").value : null,
    planRepDist: $("f_type").value==="interval" && $("f_repDist").value ? +$("f_repDist").value : null,
    planKm: nr || $("f_planKm").value === "" ? null : kmv("f_planKm"),
    planMin: $("f_planMin").value === "" ? null : +$("f_planMin").value,
    planZone: zone, planPace: nr || zone ? null : (pSec || null),
    desc: $("f_desc").value.trim(), example: false, created: prev?.created || Date.now()
  };
  if ($("f_done").checked){
    const t = $("f_time").value.trim(), sec = nr ? parseDur(t) : parseTime(t);
    if (t && t.split(":").slice(1).some(x => +x > 59)){ showErr("Minuten und Sekunden dürfen höchstens 59 sein."); return; }
    if (t && !sec){ showErr(nr ? "Dauer bitte in Minuten oder als h:mm eingeben, z. B. 90 oder 1:30." : "Zeit bitte als h:mm:ss oder mm:ss eingeben, z. B. 52:30."); return; }
    body.actual = { km: nr || $("f_km").value==="" ? null : kmv("f_km"), sec: sec || null,
      hr: nr || $("f_hr").value==="" ? null : +$("f_hr").value, rpe, feel, notes: $("f_notes").value.trim(),
      loggedAt: prev?.actual?.loggedAt || new Date().toISOString() };
  } else body.actual = null;
  $("saveBtn").disabled = true;
  const sid = editing || newId();
  try { await store.save(sid, body); $("dlg").close(); if (body.actual) showFeedback(sid); else toast("Plan gespeichert"); }
  catch(err){ showErr("Speichern hat nicht geklappt. Prüfe deine Verbindung und versuche es noch einmal."); }
  finally { $("saveBtn").disabled = false; }
};

function quickLog(){
  const t = iso(today());
  const open = list().filter(s => !s.actual && s.type!=="rest" && s.date<=t).sort(byDate);
  const todays = open.filter(s => s.date===t);
  const pick = todays[0] || open.filter(s => s.date >= iso(addDays(today(),-3))).pop();
  if (pick) openSession(pick.id, null, true); else openSession(null, t, true);
}
$("logBtn").onclick = quickLog; $("logBtn2").onclick = quickLog;

  try { await store.saveSettings({...state.settings, raceName:$("r_name").value.trim(), raceDate:$("r_date").value, goal:$("r_goal").value.trim(), easyHrMax: $("r_hr").value ? +$("r_hr").value : null}); $("raceDlg").close(); toast("Wettkampf gespeichert"); }

/* Navigation */
document.querySelectorAll(".seg button").forEach(b => b.onclick = () => { state.view = b.dataset.view; render(); });
function shift(dir){
  const a = state.anchor;
  if (state.view==="week") state.anchor = addDays(a, 7*dir);
  else if (state.view==="month") state.anchor = new Date(a.getFullYear(), a.getMonth()+dir, 1);
  else state.anchor = new Date(a.getFullYear(), a.getMonth()+6*dir, 1);
  render();
}
$("prev").onclick = () => shift(-1); $("next").onclick = () => shift(1);
$("todayBtn").onclick = () => { state.anchor = today(); render(); };
// Wischen auf dem Handy: links/rechts blättert den Zeitraum
let tx = null, ty = null;
$("view").addEventListener("touchstart", e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:true});
$("view").addEventListener("touchend", e => { if (tx===null) return; if ((td && td.active) || Date.now() - suppressClick < 600){ tx = null; return; } const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy)*1.5 && !e.target.closest(".chartbox,.tbl")) shift(dx < 0 ? 1 : -1); tx = null; }, {passive:true});

let tt; function toast(m){ let el = document.querySelector(".toast"); if(!el){ el = document.createElement("div"); el.className="toast"; el.setAttribute("role","status"); document.body.appendChild(el); } el.textContent = m; el.hidden=false; clearTimeout(tt); tt = setTimeout(()=>el.hidden=true, 2600); }

const GEAR = `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="6.6"/><path d="M12 2.6v2.8M12 18.6v2.8M2.6 12h2.8M18.6 12h2.8M5.4 5.4l2 2M16.6 16.6l2 2M5.4 18.6l2-2M16.6 7.4l2-2"/></svg>`;
const longDate = d => d.toLocaleDateString("de-DE", {weekday:"long", day:"numeric", month:"long"});
const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
function ringSvg(pct){
  const C = 2*Math.PI*38;
  return `<svg viewBox="0 0 84 84" aria-hidden="true"><circle cx="42" cy="42" r="38" fill="none" stroke="var(--line)" stroke-width="2.4"/>
    <circle cx="42" cy="42" r="38" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="${(C*pct).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 42 42)"/>
    <text x="42" y="48" text-anchor="middle" font-size="19" font-weight="300" fill="var(--ink)" font-family="Lato, Helvetica, sans-serif">${Math.round(pct*100)}%</text></svg>`;
}
const dots = items => items.filter(s => s.type!=="rest").slice(0,4).map(s => `<i class="${status(s)}" style="--tc:var(--t-${s.type})"></i>`).join("");
function storeNoteText(){ return syncText(); }

  const ex = list().some(s => s.example);
  $("mHead").innerHTML = `<div class="mtop"><span class="mbrand"><span class="bib">42,2 KM</span>Trainingsplan</span>
      <button class="mgear" id="mGear" aria-label="Mehr: Wettkampf, Export, Woche kopieren">${GEAR}${ex?'<i class="dot"></i>':""}<i class="sync" data-s="${sync.status}"></i></button></div>
    ${nav?`<button class="marrow" id="mPrev" aria-label="Zurück">‹</button>`:""}
    <div class="mtitle"><h2>${title}</h2><div>${sub}</div></div>
    ${nav?`<button class="marrow r" id="mNext" aria-label="Weiter">›</button>`:""}`;
  $("mGear").onclick = openMore;
  if (nav){ $("mPrev").onclick = () => mShift(-1); $("mNext").onclick = () => mShift(1); }
}

function renderMobile(){
  document.querySelectorAll(".mtabs [data-tab]").forEach(b => b.setAttribute("aria-current", b.dataset.tab===M.tab ? "page" : "false"));
  $("mBody").classList.remove("tight");
  ({today:mToday, week:mWeek, month:mMonth, half:mHalf})[M.tab]();
  bindCards();
  $("mBody").querySelectorAll("[data-add]").forEach(b => b.onclick = () => openSession(null, b.dataset.add));
  $("mBody").querySelectorAll("[data-goto]").forEach(b => b.onclick = () => { M.tab = "week"; M.day = parse(b.dataset.goto); render(); });
}

function mToday(){
  const t = today(), ts = iso(t), st = state.settings || {};
  mHead("Heute", longDate(t), false);
  const s0 = sow(t), wt = totals(inRange(iso(s0), iso(addDays(s0,6)))), pct = wt.planKm ? Math.min(1, wt.doneKm/wt.planKm) : 0;
  let count;
  if (st.raceDate){
    const days = Math.round((parse(st.raceDate) - t)/864e5);
    count = days > 0 ? `<div class="count"><span class="big num">${days}</span><span class="lbl">Tage bis<br>${esc(st.raceName||"zum Start")}</span></div>`
      : days === 0 ? `<div class="count"><span class="big">Heute</span><span class="lbl">Renntag</span></div>`
      : `<div class="count"><span class="big num">${-days}</span><span class="lbl">Tage seit dem Rennen</span></div>`;
  } else count = `<div class="count"><span class="lbl">Countdown</span><button class="btn ghost sm" id="mRace">Renndatum eintragen</button></div>`;
  const todays = list().filter(s => s.date===ts).sort(byDate);
  const next = list().filter(s => s.date > ts && s.type!=="rest").sort(byDate)[0];
  const missed = list().filter(s => status(s)==="missed" && s.date >= iso(addDays(t,-7))).sort(byDate);
  const ex = list().some(s => s.example);
  $("mBody").innerHTML = `
    <div class="mrings">${count}
      <div class="mring">${ringSvg(pct)}<span class="lbl">Diese Woche</span><span class="val num">${fmtKm(wt.doneKm)} <small>/ ${fmtKm(wt.planKm)} km</small></span></div></div>
    <div class="mfit" id="mFit">
      ${(() => { const f = formcheck(); return f.verdict.level === "na" ? "" : `<button class="mfc fc-${f.verdict.level} fitdrop" id="mFc"><b>${f.verdict.label}</b><span>${f.checks.filter(c => c.level !== "ok").map(c => c.title).join(" · ") || "Alle Ziele im grünen Bereich"}</span></button>`; })()}
      ${missed.length ? `<div class="mnotice fitdrop"><span>${missed.length===1 ? "1 Einheit" : missed.length+" Einheiten"} der letzten Tage offen</span><button class="mlink" data-goto="${missed[0].date}">Ansehen</button></div>` : ""}
      <div class="mlbl">Heute <span>${WD_L[(t.getDay()+6)%7]}</span></div>
      ${todays.length ? cardHtml(todays[0]) + (todays.length > 1 ? `<button class="mlink mmore" data-goto="${ts}">+ ${todays.length-1} weitere heute</button>` : "")
        : `<div class="mempty compact">Heute ist nichts geplant.<button class="btn sm" data-add="${ts}">+ Einheit</button></div>`}
      ${next ? `<div class="mnext fitdrop"><div class="mlbl">Als Nächstes <span>${WD_L[(parse(next.date).getDay()+6)%7]}, ${fmtDM(parse(next.date))}</span></div>${cardHtml(next)}</div>` : ""}
    </div>`;
  if ($("mRace")) $("mRace").onclick = openRace;
  if ($("mFc")) $("mFc").onclick = () => { M.tab = "half"; M.slide = 0; M.half = today(); render(); };
  // Alles muss ohne Scrollen passen: erst kleinere Ringe, dann Nebensachen ausblenden
  requestAnimationFrame(() => {
    const fit = $("mFit"); if (!fit) return;
    const over = () => fit.scrollHeight > fit.clientHeight + 1;
    if (over()) $("mBody").classList.add("tight");
    const drops = [...fit.querySelectorAll(".fitdrop")];
    while (over() && drops.length) drops.shift().hidden = true;
  });
}

function mWeek(){
  const d = M.day, s0 = sow(d), e0 = addDays(s0,6), ds = iso(d), ts = iso(today());
  mHead(`KW ${isoWeek(s0)}`, `${fmtDM(s0)} – ${fmtDM(e0)}${e0.getFullYear()}`, true);
  const arr = inRange(iso(s0), iso(e0)), wt = totals(arr), pct = wt.planKm ? Math.min(100, wt.doneKm/wt.planKm*100) : 0;
  let strip = "";
  for (let i=0;i<7;i++){
    const day = addDays(s0,i), di = iso(day);
    strip += `<button class="wpill ${di===ds?"sel":""} ${di===ts?"today":""}" data-date="${di}" data-pick="${di}" aria-label="${WD_L[i]} ${fmtDM(day)}">
      <span class="wd">${WD[i]}</span><span class="wn num">${day.getDate()}</span><span class="dots">${dots(arr.filter(x => x.date===di))}</span></button>`;
  }
  const items = arr.filter(x => x.date===ds).sort(byDate);
  $("mBody").innerHTML = `
    <div class="wstrip">${strip}</div>
    <div class="wsum"><span><b class="num">${fmtKm(wt.doneKm)}</b> / ${fmtKm(wt.planKm)} km</span><span class="num">${wt.doneCount} / ${wt.planCount} Einheiten</span><div class="meter"><i style="width:${pct}%"></i></div></div>
    <div class="dayhead"><h3>${WD_L[(d.getDay()+6)%7]}<small>${fmtDM(d)}</small></h3>${ds===ts ? '<span class="todaytag">Heute</span>' : ""}</div>
    <div class="mscroll" id="mWeekDay">${items.map(cardHtml).join("") || `<div class="mempty">Für diesen Tag ist nichts geplant.</div>`}<button class="add" data-add="${ds}">+ Einheit</button></div>
    <div class="mhint">Wischen wechselt den Tag · Einheit gedrückt halten und auf einen Tag oben ziehen</div>`;
  $("mBody").querySelectorAll("[data-pick]").forEach(b => b.onclick = () => {
    const nd = parse(b.dataset.pick), dir = Math.sign(nd - M.day); if (!dir) return;
    M.day = nd; render(); slideIn(dir, "#mWeekDay");
  });
}

function mMonth(){
  const a = M.month, first = new Date(a.getFullYear(), a.getMonth(), 1), last = new Date(a.getFullYear(), a.getMonth()+1, 0);
  mHead(MONTHS[a.getMonth()], String(a.getFullYear()), true);
  const ts = iso(today()); let cells = "", d = sow(first);
  while (d <= last){
    for (let i=0;i<7;i++){
      const day = addDays(d,i), di = iso(day), items = inRange(di, di);
      cells += `<button class="${day.getMonth()!==a.getMonth()?"out":""} ${di===ts?"today":""}" data-goto="${di}" aria-label="${day.toLocaleDateString("de-DE")}"><span class="n num">${day.getDate()}</span><span class="dots">${dots(items)}</span></button>`;
    }
    d = addDays(d,7);
  }
  const T = totals(inRange(iso(first), iso(last)));
  $("mBody").innerHTML = `
    <div class="mcal">${WD.map(w => `<span class="h">${w}</span>`).join("")}${cells}</div>
    <div class="mstats">
      <div><b class="num">${fmtKm(T.doneKm)}<small>/ ${fmtKm(T.planKm)} km</small></b><span>Gelaufen</span></div>
      <div><b class="num">${T.doneCount}<small>/ ${T.planCount}</small></b><span>Einheiten</span></div>
      <div><b class="num">${T.avgPace ? fmtPaceSec(T.avgPace) : "–"}<small>/km</small></b><span>Ø Pace</span></div>
      <div><b class="num">${fmtKm(T.longest)}<small>km</small></b><span>Längster Lauf</span></div>
    </div>`;
}

function mHalf(){
  const a = M.half, y = a.getFullYear(), h = a.getMonth() < 6 ? 0 : 1;
  const first = new Date(y, h*6, 1), last = new Date(y, h*6+6, 0);
  mHead(`${h ? "2." : "1."} Halbjahr`, String(y), true);
  const arr = inRange(iso(first), iso(last)), T = totals(arr);
  // Wochenbalken
  const weeks = []; let d = sow(first);
  while (d <= last){ weeks.push({start:d, ...totals(inRange(iso(d), iso(addDays(d,6))))}); d = addDays(d,7); }
  const maxV = Math.max(10, ...weeks.map(w => Math.max(w.planKm, w.doneKm)));
  const step = maxV > 80 ? 20 : maxV > 40 ? 10 : 5, top = Math.ceil(maxV/step)*step;
  const W = 340, H = 210, L = 26, R = 4, Tp = 10, B = 26, cw = (W-L-R)/weeks.length, bw = Math.max(4, cw*0.6);
  const yv = v => Tp + (H-Tp-B) * (1 - v/top), cur = iso(sow(today()));
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Wochenkilometer geplant und gelaufen">`;
  for (let v=0; v<=top; v+=step) svg += `<line x1="${L}" x2="${W-R}" y1="${yv(v)}" y2="${yv(v)}" stroke="var(--line-soft)"/><text x="${L-5}" y="${yv(v)+3.5}" text-anchor="end" font-size="9.5" fill="var(--muted)" font-family="Lato, Helvetica, sans-serif">${v}</text>`;

  });
  svg += `</svg>`;
  // Monate
  const curM = `${today().getFullYear()}-${today().getMonth()}`;
  let rows = "";

  rows += `<tr><td>Summe</td><td>${fmtKm(T.doneKm)} / ${fmtKm(T.planKm)}</td><td>${T.avgPace ? fmtPaceSec(T.avgPace) : "–"}</td><td>${T.planCount ? Math.round(T.doneCount/T.planCount*100)+" %" : "–"}</td></tr>`;
  // Arten
  const byType = {}; arr.filter(s => s.actual && s.type!=="rest").forEach(s => { byType[s.type] = (byType[s.type]||0) + 1; });
  const tmax = Math.max(1, ...Object.values(byType));
  const tb = Object.keys(TYPES).filter(k => byType[k]).map(k => `<div class="tb" style="--tc:var(--t-${k})"><span>${TYPES[k].label}</span><span class="bar"><i style="width:${byType[k]/tmax*100}%"></i></span><span class="n num">${byType[k]}×</span></div>`).join("") || `<p class="note">Noch keine absolvierten Einheiten in diesem Halbjahr.</p>`;

/* Blätter nach unten wischen zum Schließen */
function sheetSwipe(dlg){
  let y0 = null, x0 = 0, dy = 0, active = false;
  dlg.addEventListener("touchstart", e => {
    if (!PHONE.matches || e.touches.length > 1 || e.target.closest("input,textarea,select,.palette")){ y0 = null; return; }
    y0 = e.touches[0].clientY; x0 = e.touches[0].clientX; dy = 0; active = false;
  }, {passive:true});
  dlg.addEventListener("touchmove", e => {
    if (y0 === null) return;
    const d = e.touches[0].clientY - y0, dx = e.touches[0].clientX - x0;
    if (!active){
      if (d > 8 && d > Math.abs(dx) && dlg.scrollTop <= 0){ active = true; dlg.classList.remove("sheet-back"); }
      else if (Math.abs(d) > 8 || Math.abs(dx) > 8){ y0 = null; return; }
      else return;
    }
    e.preventDefault(); dy = Math.max(0, d); dlg.style.transform = `translateY(${dy}px)`;
  }, {passive:false});
  const end = () => {
    if (y0 === null) return; y0 = null; if (!active) return; active = false;
    dlg.classList.add("sheet-back");
    if (dy > 110){ dlg.style.transform = "translateY(105%)"; setTimeout(() => { dlg.close(); dlg.style.transform = ""; dlg.classList.remove("sheet-back"); }, 210); }
    else { dlg.style.transform = ""; setTimeout(() => dlg.classList.remove("sheet-back"), 240); }
  };
  dlg.addEventListener("touchend", end); dlg.addEventListener("touchcancel", end);
}

/* ---------- Zeitfelder: Doppelpunkte setzen sich selbst ---------- */
// Nur Ziffern tippen: "05230" wird 0:52:30, "130" wird 1:30 (Kraft/Bouldern), "530" wird 5:30 (Pace)
const MASKS = { hms:[1,2,2], hm:[1,2], ms:[1,2] };
function maskDigits(d, groups){
  const out = []; let i = 0;
  for (const g of groups){ if (i >= d.length) break; out.push(d.slice(i, i+g)); i += g; }
  return out.join(":");
}
document.addEventListener("input", e => {
  const el = e.target; if (!el.matches || !el.matches("input[data-mask]")) return;
  const groups = MASKS[el.dataset.mask]; if (!groups) return;
  const max = groups.reduce((a,b) => a+b, 0);
  let d = el.value.replace(/\D/g, "").slice(0, max);
  // Rückschritt auf einen Doppelpunkt löscht die Ziffer davor mit
  if (e.inputType === "deleteContentBackward" && d === (el.dataset.prev || "") && d.length) d = d.slice(0, -1);
  el.value = maskDigits(d, groups); el.dataset.prev = d;
  try { el.setSelectionRange(el.value.length, el.value.length); } catch(err){}
  // Alle Ziffern eingegeben (z. B. 5 bei h:mm:ss): Eingabe fertig, Tastatur schließen
  if (d.length === max && !(e.inputType || "").startsWith("delete")) setTimeout(() => el.blur(), 120);
}, true);
document.addEventListener("focusin", e => { const el = e.target; if (el.matches && el.matches("input[data-mask]")) el.dataset.prev = el.value.replace(/\D/g, ""); });

function phaseInfo(){
  const rd = state.settings && state.settings.raceDate;
  if (!rd) return null;
  const days = Math.round((parse(rd) - today()) / 864e5), w = Math.floor(days / 7);
  const name = days < 0 ? "Nach dem Rennen" : w <= 0 ? "Rennwoche" : w <= 3 ? "Tapering" : w <= 18 ? "Marathonvorbereitung" : "Grundlagenphase";
  return { days, weeks: w, name };
}
// Marathon-Prognose nach Riegel aus einem Wettkampf ab 5 km
function riegel(sec, km){ return sec * Math.pow(42.195 / km, 1.06); }

function sessionFeedback(s){
  const a = s && s.actual; if (!a) return null;
  const notes = []; let level = "ok";
  const warn = t => { notes.push(t); if (level === "ok") level = "warn"; };
  const pace = paceOf(a), pp = planPace(s), hrMax = +(state.settings && state.settings.easyHrMax) || 0;
  if (NONRUN.has(s.type)){
    notes.push(s.type === "strength" ? "Kraft & Stabi erledigt. Das schützt Knie und Sprunggelenk." : "Erledigt. Gute Abwechslung zum Laufen.");
  } else if (isEasy(s)){
    let fine = true;
    if (pace && pp && pace < pp - GOALS.easyFaster){ warn(`Etwas schnell für einen lockeren Lauf: ${fmtPaceSec(pace)} statt ~${fmtPaceSec(pp)} /km.`); fine = false; }
    if (a.hr && hrMax && a.hr > hrMax){ warn(`Ø Puls ${a.hr} liegt über deiner Grenze von ${hrMax}.`); fine = false; }
    if (a.rpe && a.rpe > GOALS.easyRpe){ warn(`Anstrengung ${a.rpe}/10 ist hoch für einen lockeren Lauf.`); fine = false; }
    if (fine) notes.push(`Schön locker${pace ? ": " + fmtPaceSec(pace) + " /km" : ""}${a.hr ? ", Puls " + a.hr : ""}.`);
  } else if (isHard(s)){
    notes.push("Harte Einheit erledigt.");
    if (a.rpe >= GOALS.hardRpe) warn(`Sehr hart (${a.rpe}/10). Geh die Wiederholungen beim nächsten Mal etwas ruhiger an.`);
    else if (a.rpe && a.rpe <= 5) notes.push("Fühlte sich leicht an: ein gutes Zeichen für deine Form.");
  } else if (s.type === "race" && a.km >= 5 && a.sec){
    const p = riegel(a.sec, a.km), g = goalSec(state.settings && state.settings.goal);
    notes.push(`${fmtPaceSec(pace)} /km. Hochgerechnet auf den Marathon: ${fmtTime(p)}${g ? (p <= g ? " – im Bereich deiner Zielzeit." : ` (Ziel ${fmtTime(g)}).`) : "."}`);
  }
  if (RUN(s) && a.km && s.planKm){
    const r = a.km / s.planKm;
    if (r < 0.85) warn(`Kürzer als geplant (${fmtKm(a.km)} von ${fmtKm(s.planKm)} km).`);
    else if (r > 1 + GOALS.overPlan) warn(`Länger als geplant (${fmtKm(a.km)} statt ${fmtKm(s.planKm)} km).`);
  }
  if (a.feel && a.feel <= GOALS.heavyFeel) warn("Hat sich schwer angefühlt. Häufen sich solche Tage, lieber einen Ruhetag einschieben.");
  return { level, text: notes.join(" ") };
}

/* Wochen- und Trendauswertung */
function formcheck(){
  const t = today(), curStart = sow(t), lastStart = addDays(curStart, -7);
  const rng = (a, days) => inRange(iso(a), iso(addDays(a, days - 1)));
  const lastWeek = rng(lastStart, 7), last14 = inRange(iso(addDays(t, -14)), iso(addDays(t, -1))).concat(inRange(iso(t), iso(t)));
  const last28 = inRange(iso(addDays(curStart, -28)), iso(addDays(curStart, -1)));
  const logged = list().filter(s => s.actual && RUN(s));
  const checks = [];
  const add = (key, title, goal, level, text) => checks.push({ key, title, goal, level, text });

  // 1 Planerfüllung letzte Woche
  const runsLW = lastWeek.filter(RUN), planKm = runsLW.reduce((n, s) => n + (+s.planKm || 0), 0), doneKm = runsLW.reduce((n, s) => n + (s.actual && +s.actual.km || 0), 0);
  const allLW = lastWeek.filter(s => s.type !== "rest"), doneLW = allLW.filter(s => s.actual).length;
  if (planKm > 0){
    const r = doneKm / planKm;
    add("plan", "Plan erfüllt", `mind. ${Math.round(GOALS.planMin*100)} % der Kilometer`, r >= GOALS.planMin ? "ok" : r >= GOALS.planWarn ? "warn" : "bad",
      `KW ${isoWeek(lastStart)}: ${fmtKm(doneKm)} von ${fmtKm(planKm)} km (${Math.round(r*100)} %), ${doneLW} von ${allLW.length} Einheiten.`);
    // 2 Umfang im Rahmen
    const over = doneKm - planKm;
    add("volume", "Umfang im Rahmen", `höchstens ${Math.round(GOALS.overPlan*100)} % über Plan`, over > Math.max(3, planKm * GOALS.overPlan) ? (over > planKm * 0.3 ? "bad" : "warn") : "ok",
      over > Math.max(3, planKm * GOALS.overPlan) ? `${fmtKm(over)} km mehr als geplant. Zu schnelle Steigerung erhöht das Verletzungsrisiko.` : "Kein Ausreißer nach oben.");
  }

  // 3 Lockere Läufe locker (14 Tage)
  const easy = last14.filter(s => isEasy(s) && s.actual), hrMax = +(state.settings && state.settings.easyHrMax) || 0;
  if (easy.length){
    const tooFast = easy.filter(s => { const p = paceOf(s.actual), pp = planPace(s); return (p && pp && p < pp - GOALS.easyFaster) || (hrMax && s.actual.hr > hrMax) || (s.actual.rpe > GOALS.easyRpe); });
    add("easy", "Locker bleibt locker", `max. ${GOALS.easyFaster} s/km schneller als geplant${hrMax ? ", Puls ≤ " + hrMax : ""}, RPE ≤ ${GOALS.easyRpe}`,
      !tooFast.length ? "ok" : tooFast.length * 2 > easy.length ? "bad" : "warn",
      tooFast.length ? `${tooFast.length} von ${easy.length} lockeren Läufen ${tooFast.length === 1 ? "war" : "waren"} zu flott oder zu anstrengend.` : (easy.length === 1 ? "Der lockere Lauf war im grünen Bereich." : `Alle ${easy.length} lockeren Läufe im grünen Bereich.`));
  }

  // 4 Harte Einheiten
  const hardPlanned = last14.filter(s => isHard(s) && s.date < iso(t)), hardDone = hardPlanned.filter(s => s.actual);
  if (hardPlanned.length){
    const tooHard = hardDone.filter(s => s.actual.rpe >= GOALS.hardRpe);
    add("hard", "Tempo-Einheiten", "geplante Einheiten erledigt, RPE unter " + GOALS.hardRpe,
      hardDone.length < hardPlanned.length ? "warn" : tooHard.length ? "warn" : "ok",
      `${hardDone.length} von ${hardPlanned.length} erledigt${tooHard.length ? ", " + tooHard.length + "× sehr hart" : ""}.`);
  }

  // 5 Langer Lauf (4 Wochen)
  const runs28 = last28.filter(RUN), longPlan = Math.max(0, ...runs28.map(s => +s.planKm || 0)), longDone = Math.max(0, ...runs28.filter(s => s.actual).map(s => +s.actual.km || 0));
  if (longPlan >= 10){
    const r = longDone / longPlan;
    add("long", "Langer Lauf", `mind. ${Math.round(GOALS.longMin*100)} % der längsten geplanten Distanz`, r >= GOALS.longMin ? "ok" : r >= 0.75 ? "warn" : "bad",
      `Längster Lauf der letzten 4 Wochen: ${fmtKm(longDone)} km (geplant ${fmtKm(longPlan)} km).`);
  }

  // 6 Kraft & Stabi (14 Tage)
  const str = last14.filter(s => s.type === "strength" && (s.date < iso(t) || s.actual)), strDone = str.filter(s => s.actual).length;
  if (str.length){
    const r = strDone / str.length;
    add("strength", "Kraft & Stabi", `mind. ${Math.round(GOALS.strengthMin*100)} % der Einheiten`, r >= GOALS.strengthMin ? "ok" : r >= 0.5 ? "warn" : "bad",
      `${strDone} von ${str.length} Einheiten in den letzten 14 Tagen.`);
  }

  // 7 Erholung: Gefühl der letzten 5 Einheiten
  const recent = list().filter(s => s.actual && s.actual.feel).sort(byDate).slice(-5);
  if (recent.length >= 3){
    const heavy = recent.filter(s => s.actual.feel <= GOALS.heavyFeel).length;
    add("feel", "Erholung", "höchstens 1 von 5 Einheiten schwer", heavy >= 3 ? "bad" : heavy === 2 ? "warn" : "ok",
      heavy ? `${heavy} der letzten ${recent.length} Einheiten ${heavy === 1 ? "fühlte" : "fühlten"} sich schwer an.` : "Du fühlst dich zuletzt gut.");
  }

  // Prognose aus Wettkämpfen der letzten 8 Wochen
  const races = list().filter(s => s.type === "race" && s.actual && s.actual.km >= 5 && s.actual.sec && s.date >= iso(addDays(t, -56)));
  let forecast = null;
  if (races.length){
    const best = races.map(s => ({ s, p: riegel(s.actual.sec, s.actual.km) })).sort((a, b) => a.p - b.p)[0];
    forecast = { sec: best.p, from: best.s };
  }

  // Gesamturteil
  const scored = checks.map(c => LV[c.level]);
  const bad = checks.filter(c => c.level === "bad").length, warn = checks.filter(c => c.level === "warn").length;
  let verdict;
  if (logged.length < 3 || checks.length < 2) verdict = { level:"na", label:"Noch zu wenig Daten", text:"Nach ein paar eingetragenen Läufen siehst du hier, ob du auf Kurs bist." };
  else if (bad >= 2) verdict = { level:"bad", label:"Gegensteuern", text:"Mehrere Ziele sind gerissen. Schau dir unten an, wo es hakt." };
  else if (bad || warn >= 2) verdict = { level:"warn", label:"Achtung", text:"Grundsätzlich auf dem Weg, aber ein paar Punkte solltest du im Blick behalten." };
  else verdict = { level:"ok", label:"Auf Kurs", text:"Du setzt den Plan gut um. Weiter so." };
  const score = scored.length ? Math.round(scored.reduce((a, b) => a + b, 0) / (scored.length * 2) * 100) : null;
  return { verdict, checks, phase: phaseInfo(), forecast, score };
}

const LV_LABEL = { ok:"Im Ziel", warn:"Knapp", bad:"Verfehlt", na:"–" };
function formcheckHtml(compact){
  const f = formcheck(), ph = f.phase, g = goalSec(state.settings && state.settings.goal);
  const head = `<div class="fc-head fc-${f.verdict.level}">
      <span class="fc-dot"></span>
      <div><div class="fc-label">${f.verdict.label}</div><div class="fc-text">${f.verdict.text}</div></div>
      ${f.score !== null && f.verdict.level !== "na" ? `<div class="fc-score num">${f.score}<small>%</small></div>` : ""}
    </div>
    ${ph ? `<div class="fc-meta">${ph.days >= 0 ? `Noch ${ph.weeks} Wochen bis zum Rennen` : "Rennen vorbei"} · ${ph.name}${f.forecast ? ` · Prognose ${fmtTime(f.forecast.sec)}${g ? " (Ziel " + fmtTime(g) + ")" : ""}` : ""}</div>` : ""}`;
  const rows = f.checks.map(c => `<div class="fc-row fc-${c.level}">
      <span class="fc-dot"></span>
      <div class="fc-body"><div class="fc-t">${c.title}<span class="fc-lv">${LV_LABEL[c.level]}</span></div>
      <div class="fc-x">${esc(c.text)}</div>${compact ? "" : `<div class="fc-goal">Ziel: ${esc(c.goal)}</div>`}</div></div>`).join("");
  return head + (rows ? `<div class="fc-list">${rows}</div>` : `<p class="note">Sobald Einheiten aus der letzten Woche eingetragen sind, erscheinen hier die einzelnen Ziele.</p>`)
    + `<p class="note fc-foot">Ausgewertet wird direkt auf deinem Gerät nach festen Regeln, ohne KI und ohne dass Daten das Gerät verlassen.${!(state.settings && state.settings.easyHrMax) ? " Tipp: Trag unter Wettkampf & Ziele deine Puls-Obergrenze für lockere Läufe ein." : ""}</p>`;
}

/* Rückmeldung nach dem Speichern */
let fbTimer = null;
function showFeedback(id){
  const s = state.sessions.get(id), fb = sessionFeedback(s); if (!fb) return;
  let el = $("fbCard");
  el.className = "fbcard fc-" + fb.level; el.hidden = false;
  el.innerHTML = `<span class="fc-dot"></span><div><div class="fc-t">${esc(s.title || TYPES[s.type]?.label || "Einheit")}</div><div class="fc-x">${esc(fb.text)}</div></div><button class="iconx" aria-label="Schließen">×</button>`;
  el.querySelector("button").onclick = () => { el.hidden = true; };
  clearTimeout(fbTimer); fbTimer = setTimeout(() => { el.hidden = true; }, 9000);
}

/* ---------- Dateien speichern und einlesen ---------- */
async function saveFile(blob, name){
  const file = new File([blob], name, { type: blob.type || "application/octet-stream" });
  // Auf dem Handy: Teilen-Menü (Dateien, AirDrop, Mail …), sonst normaler Download
  if (PHONE.matches && navigator.canShare && navigator.canShare({ files: [file] })){
    try { await navigator.share({ files: [file], title: name }); return true; }
    catch(e){ if (e && e.name === "AbortError") return false; }
  }
  const url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  return true;
}
async function exportJson(){
  const data = { format: "trainingsplan", version: 2, exported: new Date().toISOString(),
    settings: state.settings, sessions: list(), templates: state.templates };
  const ok = await saveFile(new Blob([JSON.stringify(data, null, 1)], { type: "application/json" }), `Trainingsplan-Sicherung_${iso(today())}.json`);
  if (ok) toast("Sicherung erstellt");
}
function pickImport(){ $("importFile").value = ""; $("importFile").click(); }
$("importFile").addEventListener("change", async e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!d || !Array.isArray(d.sessions)) throw new Error("format");
    let n = 0;
    d.sessions.forEach(s => { if (!s || !s.id || !s.date) return; const { id, ...body } = s; put("sessions", String(id), body, true); n++; });
    if (d.settings && typeof d.settings === "object") put("settings", "main", { ...state.settings, ...d.settings }, true);
    (d.templates || []).forEach(t => { if (t && t.id){ const { id, ...b } = t; put("templates", String(id), b, true); } });
    saveLocalDb(); applyDocs(); render(); scheduleSync(100);
    toast(`${n} Einheiten importiert`);
  } catch(err){ toast("Die Datei konnte nicht gelesen werden. Wähle eine Sicherung aus dieser App."); }
});

if ("serviceWorker" in navigator && location.protocol !== "file:"){
  navigator.serviceWorker.register("sw.js").then(reg => {

      const w = reg.installing; if (!w) return;

    });
  }).catch(() => {});
}

init();
})();

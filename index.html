function renderHalf(){
  const a = state.anchor, y = a.getFullYear(), h = a.getMonth() < 6 ? 0 : 1;
  const first = new Date(y, h*6, 1), last = new Date(y, h*6+6, 0);
  $("period").textContent = `${h?"2.":"1."} Halbjahr ${y}`;
  const arr = inRange(iso(first), iso(last)), T = totals(arr);
  $("summary").innerHTML = statsHtml(T, `<div class="stat"><span class="k">Längster Lauf</span><span class="v num">${fmtKm(T.longest)}<small>km</small></span></div>`);

  const weeks = []; let d = sow(first);
  while (d <= last){ const wk = totals(inRange(iso(d), iso(addDays(d,6)))); weeks.push({start:d, ...wk}); d = addDays(d,7); }
  const maxV = Math.max(10, ...weeks.map(w => Math.max(w.planKm, w.doneKm)));
  const step = maxV > 80 ? 20 : maxV > 40 ? 10 : 5, top = Math.ceil(maxV/step)*step;
  const W = 820, H = 260, L = 40, R = 10, Tp = 14, B = 34, cw = (W-L-R)/weeks.length, bw = Math.max(6, cw*0.62);
  const yv = v => Tp + (H-Tp-B) * (1 - v/top);
  const curWk = iso(sow(today()));
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Wochenkilometer geplant und gelaufen">`;
  for (let v=0; v<=top; v+=step){ svg += `<line x1="${L}" x2="${W-R}" y1="${yv(v)}" y2="${yv(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${yv(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="Lato, Helvetica, sans-serif">${v}</text>`; }
  weeks.forEach((w,i) => {
    const x = L + i*cw + (cw-bw)/2, isCur = iso(w.start)===curWk;
    if (w.planKm) svg += `<rect x="${x}" y="${yv(w.planKm)}" width="${bw}" height="${yv(0)-yv(w.planKm)}" rx="2" fill="none" stroke="var(--muted)" stroke-opacity=".6" stroke-dasharray="2 3" stroke-width="1"/>`;
    if (w.doneKm) svg += `<rect x="${x+bw/2-3}" y="${yv(w.doneKm)}" width="6" height="${yv(0)-yv(w.doneKm)}" rx="3" fill="${isCur?"var(--bib)":"var(--accent)"}"><title>KW ${isoWeek(w.start)}: ${fmtKm(w.doneKm)} von ${fmtKm(w.planKm)} km</title></rect>`;
    if (i%2===0 || weeks.length<16) svg += `<text x="${x+bw/2}" y="${H-B+16}" text-anchor="middle" font-size="10.5" fill="var(--muted)" font-family="Lato, Helvetica, sans-serif">${isoWeek(w.start)}</text>`;
    if (isCur) svg += `<text x="${x+bw/2}" y="${H-4}" text-anchor="middle" font-size="9.5" font-weight="700" letter-spacing="1.2" fill="var(--bib)">JETZT</text>`;
  });
  svg += `</svg>`;

  let rows = "";
  const curM = `${today().getFullYear()}-${today().getMonth()}`;
  for (let m=0;m<6;m++){
    const mf = new Date(y, h*6+m, 1), ml = new Date(y, h*6+m+1, 0), mt = totals(inRange(iso(mf), iso(ml)));
    const q = mt.planCount ? Math.round(mt.doneCount/mt.planCount*100)+" %" : "–";
    rows += `<tr class="click ${curM===`${y}-${h*6+m}`?"cur":""}" data-month="${iso(mf)}"><td>${MONTHS[h*6+m]}</td><td>${fmtKm(mt.planKm)}</td><td>${fmtKm(mt.doneKm)}</td><td>${mt.avgPace?fmtPaceSec(mt.avgPace):"–"}</td><td>${mt.doneCount}/${mt.planCount}</td><td>${q}</td></tr>`;
  }
  rows += `<tr><td>Summe</td><td>${fmtKm(T.planKm)}</td><td>${fmtKm(T.doneKm)}</td><td>${T.avgPace?fmtPaceSec(T.avgPace):"–"}</td><td>${T.doneCount}/${T.planCount}</td><td>${T.planCount?Math.round(T.doneCount/T.planCount*100)+" %":"–"}</td></tr>`;

  const byType = {}; arr.filter(s=>s.actual && s.type!=="rest").forEach(s => { byType[s.type] = byType[s.type]||{n:0}; byType[s.type].n++; });
  const tmax = Math.max(1, ...Object.values(byType).map(v=>v.n));
  const tb = Object.keys(TYPES).filter(k=>byType[k]).map(k => `<div class="tb" style="--tc:var(--t-${k})"><span>${TYPES[k].label}</span><span class="bar"><i style="width:${byType[k].n/tmax*100}%"></i></span><span class="n num">${byType[k].n}×</span></div>`).join("") || `<p class="note">Noch keine absolvierten Einheiten in diesem Halbjahr.</p>`;

  $("view").innerHTML = `<div style="display:grid;gap:16px">
    ${(() => { const A = analysis(); return `
    <div class="hgrid an-grid">
      <div class="panel anpanel"><h2>Formzeit</h2>${anaFormzeitHtml(A, false)}</div>
      <div class="panel anpanel"><h2>Woher die Formzeit kommt</h2>${anaFactorsHtml(A, false)}</div></div>
    <div class="hgrid an-grid">
      <div class="panel anpanel"><h2>Bereitschaft</h2>${anaReadyHtml(A, false)}</div>
      <div class="an-col"><div class="panel anpanel"><h2>Prognose</h2>${anaForecastHtml(A, false)}</div>
        <div class="panel anpanel"><h2>Fitness aus dem Puls</h2>${anaFitHtml(false)}</div></div></div>
    <div class="hgrid an-grid">
      <div class="panel fcpanel"><h2>Formcheck</h2>${formcheckHtml(false)}</div><div></div></div>`; })()}
    <div class="panel"><h2>Wochenkilometer</h2>
      <div class="legend"><span><i class="sw" style="border:1px dashed var(--muted)"></i>geplant</span><span><i class="sw" style="background:var(--accent)"></i>gelaufen</span><span><i class="sw" style="background:var(--bib)"></i>aktuelle Woche</span></div>
      <div class="chartbox">${svg}</div></div>
    <div class="hgrid">

      <div class="panel"><h2>Trainingsarten</h2><div class="typebars">${tb}</div></div>
    </div></div>`;
  document.querySelectorAll("tr[data-month]").forEach(r => r.onclick = () => { state.anchor = parse(r.dataset.month); state.view = "month"; render(); });
}

let xlsxLoading = null;
function loadXLSX(){
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (!xlsxLoading) xlsxLoading = new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "vendor/xlsx.full.min.js";
    s.onload = () => res(window.XLSX); s.onerror = () => { xlsxLoading = null; rej(new Error("load")); };
    document.head.appendChild(s);
  });
  return xlsxLoading;
}
async function exportExcel(){
  const done = list().filter(s => s.actual).sort(byDate);
  if (!done.length){ toast("Noch keine absolvierten Einheiten zum Exportieren"); return; }
  const btn = $("exportBtn"); btn.disabled = true;
  try {
    const XLSX = await loadXLSX();
    const rows = done.map(s => {
      const d = parse(s.date), a = s.actual, pp = planPace(s);
      return {
        "Datum": d, "Wochentag": WD_L[(d.getDay()+6)%7], "KW": isoWeek(d),
        "Art": TYPES[s.type]?.label || s.type, "Titel": s.title || "",
        "Plan Distanz (km)": s.planKm ?? "", "Plan Dauer (min)": planMinutes(s) ?? "", "Plan Zone": s.planZone && ZONES[s.planZone] ? ZONES[s.planZone].label : "", "Plan Pace (min/km)": pp ? fmtPaceSec(pp) : "",
        "Distanz (km)": a.km ?? "", "Zeit (h:mm:ss)": a.sec ? fmtTime(a.sec) : "", "Dauer (min)": a.sec ? Math.round(a.sec/6)/10 : "",
        "Pace (min/km)": a.km && a.sec ? fmtPaceSec(a.sec/a.km) : "", "Ø Puls": a.hr ?? "", "RPE": a.rpe ?? "",
        "Gefühl": a.feel ? FEELS[a.feel-1] : "", "Beschwerden": (a.tags||[]).map(t => TAGS[t]).filter(Boolean).join(", "), "Notiz": a.notes || ""
      };
    });
    const ws = XLSX.utils.json_to_sheet(rows, {cellDates:true, dateNF:"dd.mm.yyyy"});
    ws["!cols"] = [12,12,5,16,26,10,10,14,10,11,12,10,11,8,6,9,22,36].map(w => ({wch:w}));
    ws["!autofilter"] = {ref: ws["!ref"]};
    // Wochenübersicht
    const wk = new Map();
    list().filter(s => s.type!=="rest").forEach(s => { const k = iso(sow(parse(s.date))); if(!wk.has(k)) wk.set(k,[]); wk.get(k).push(s); });
    const wrows = [...wk.keys()].sort().map(k => { const t = totals(wk.get(k)), d = parse(k);
      return {"KW": isoWeek(d), "Woche ab": d, "Plan km": Math.round(t.planKm*10)/10, "Gelaufen km": Math.round(t.doneKm*100)/100,
        "Einheiten geplant": t.planCount, "Einheiten absolviert": t.doneCount, "Ø Pace (min/km)": t.avgPace ? fmtPaceSec(t.avgPace) : "",
        "Trainingszeit (h:mm)": t.sec ? fmtTime(t.sec).replace(/:\d\d$/,"") : "", "Ø RPE": t.rpe ? Math.round(t.rpe*10)/10 : "" }; });
    const ws2 = XLSX.utils.json_to_sheet(wrows, {cellDates:true, dateNF:"dd.mm.yyyy"});
    ws2["!cols"] = [5,12,9,11,10,12,12,12,7].map(w => ({wch:w}));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Trainings");
    XLSX.utils.book_append_sheet(wb, ws2, "Wochen");
    const out = XLSX.write(wb, {bookType:"xlsx", type:"array"});
    const name = `Trainings_${iso(today())}.xlsx`;
    const ok = await saveFile(new Blob([out], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}), name);
    if (ok) toast(`${done.length} Einheiten exportiert`);
  } catch(e){
    toast(e && e.message === "load" ? "Das Excel-Modul konnte nicht geladen werden. Öffne die App einmal mit Internet." : "Export hat nicht geklappt. Versuch es gleich noch einmal.");
  } finally { btn.disabled = false; }
}

function updatePace(){

  return parts || `<span class="muted">Keine Planwerte</span>`;

/* Heute: der ganze Weg bis zum Rennen – Wochenkilometer, Phasen, Bilanz */
function pathWeeks(){
  const all = list().filter(s => s.type !== "rest"); if (!all.length) return null;
  const st = state.settings || {}, first = all.reduce((a, s) => s.date < a ? s.date : a, all[0].date);
  const lastDate = st.raceDate || all.reduce((a, s) => s.date > a ? s.date : a, all[0].date);
  const start = sow(parse(first)), end = sow(parse(lastDate)), race = st.raceDate ? parse(st.raceDate) : null;
  const weeks = [];
  for (let d = start; d <= end && weeks.length < 104; d = addDays(d, 7)){
    const tt = totals(inRange(iso(d), iso(addDays(d, 6))));
    const toRace = race ? Math.floor((race - d) / (7*864e5)) : 99;
    weeks.push({ start:d, plan:tt.planKm, done:tt.doneKm, phase: toRace <= 3 ? "taper" : toRace <= 18 ? "build" : "base" });
  }
  return weeks;
}
const PHASES = { base:{label:"Grundlage", tc:"easy"}, build:{label:"Marathonplan", tc:"long"}, taper:{label:"Tapering", tc:"tempo"} };
function pathHtml(){
  const weeks = pathWeeks(); if (!weeks || weeks.length < 2) return "";
  const st = state.settings || {}, cur = iso(sow(today())), ci = weeks.findIndex(w => iso(w.start) === cur);
  const maxV = Math.max(10, ...weeks.map(w => Math.max(w.plan, w.done)));
  const n = weeks.length, W = n * 10, H = 100, bw = 6;
  let bars = "";
  weeks.forEach((w, i) => {
    const x = i*10 + 2, past = iso(w.start) < cur, isCur = i === ci;
    const hp = w.plan / maxV * H, hd = Math.min(w.done, maxV) / maxV * H;
    if (hp) bars += `<rect x="${x}" y="${H-hp}" width="${bw}" height="${hp}" rx="1.5" fill="var(--t-${PHASES[w.phase].tc})" fill-opacity="${past || isCur ? .16 : .3}"/>`;
    if (hd) bars += `<rect x="${x}" y="${H-hd}" width="${bw}" height="${hd}" rx="1.5" fill="${isCur ? "var(--bib)" : "var(--accent)"}"/>`;
  });
  // Phasen als Band unter den Balken
  const segs = []; weeks.forEach(w => { const l = segs[segs.length-1]; if (l && l.p === w.phase) l.n++; else segs.push({ p:w.phase, n:1 }); });
  const used = [...new Set(segs.map(s => s.p))];
  // Bilanz
  const doneAll = list().filter(s => s.actual && RUN(s));
  const kmAll = doneAll.reduce((a, s) => a + (+s.actual.km || 0), 0), longest = Math.max(0, ...doneAll.map(s => +s.actual.km || 0));
  let streak = 0;
  for (let i = (ci >= 0 ? ci : weeks.length) - 1; i >= 0; i--){ const w = weeks[i]; if (!w.plan) continue; if (w.done >= w.plan * GOALS.planMin) streak++; else break; }
  const goal = list().filter(s => s.type === "race" && s.date >= iso(today()) && s.date !== st.raceDate).sort(byDate)[0];
  const goalDays = goal ? Math.round((parse(goal.date) - today()) / 864e5) : 0;
  const wk = ci >= 0 ? `Woche ${ci+1} von ${n}` : iso(weeks[0].start) > cur ? `Start in ${Math.ceil((weeks[0].start - today())/864e5)} Tagen` : `${n} Wochen`;
  return `<section class="mpath">
      <div class="mlbl">Weg zum ${esc(st.raceName || "Rennen")} <span>${wk}</span></div>
      <div class="mpchart" id="mPath"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Wochenkilometer vom Planstart bis zum Rennen">${bars}</svg>${ci >= 0 ? `<div class="mpmark${(ci*10+5)/(n*10) > .75 ? " flip" : ""}" style="left:${((ci*10+5)/(n*10)*100).toFixed(2)}%"><span>Heute</span></div>` : ""}</div>
      <div class="mpphase">${segs.map(s => `<i style="flex:${s.n};--tc:var(--t-${PHASES[s.p].tc})"></i>`).join("")}</div>
      <div class="mpleg">${used.map(p => `<span style="--tc:var(--t-${PHASES[p].tc})"><i></i>${PHASES[p].label}</span>`).join("")}<span class="r" style="--tc:var(--accent)"><i></i>gelaufen</span></div>
      ${goal ? `<div class="mgoal fitdrop">${esc(goal.title || "Wettkampf")}<span>${fmtDM(parse(goal.date))} · noch ${goalDays} ${goalDays === 1 ? "Tag" : "Tage"}</span></div>` : ""}
      <div class="mstats three">
        <div><b class="num">${fmtKm(kmAll)}<small>km</small></b><span>Gelaufen</span></div>
        <div><b class="num">${fmtKm(longest)}<small>km</small></b><span>Längster Lauf</span></div>
        <div><b class="num">${streak}<small>${streak === 1 ? "Woche" : "Wochen"}</small></b><span>Plan in Folge</span></div>
      </div>
    </section>`;
}


function mWeek(){
  const d = M.day, s0 = sow(d), e0 = addDays(s0,6), ds = iso(d), ts = iso(today());
  mHead(`KW ${isoWeek(s0)}`, `${fmtDM(s0)} – ${fmtDM(e0)}${e0.getFullYear()}`, true);
  const arr = inRange(iso(s0), iso(e0)), wt = totals(arr), pct = wt.planKm ? Math.min(100, wt.doneKm/wt.planKm*100) : 0;
  let strip = "";
  for (let i=0;i<7;i++){
    const day = addDays(s0,i), di = iso(day);
    strip += `<button class="wpill ${di===ds?"sel":""} ${di===ts?"today":""}" data-date="${di}" data-pick="${di}" aria-label="${WD_L[i]} ${fmtDM(day)}">
      <span class="wd">${WD[i]}</span><span class="wn num">${day.getDate()}</span><span class="dots">${dots(arr.filter(x => x.date===di))}</span></button>`;
  }
  const items = arr.filter(x => x.date===ds).sort(byDate);
  $("mBody").innerHTML = `
    <div class="wstrip">${strip}</div>
    ${isMin() ? `<button class="mtoggle sm" data-tg="week" aria-expanded="${!!M.open.week}">Wochensumme<small>${wt.doneCount} / ${wt.planCount} Einheiten</small></button>` : ""}
    <div class="wsum"${isMin() && !M.open.week ? " hidden" : ""}><span><b class="num">${fmtKm(wt.doneKm)}</b> / ${fmtKm(wt.planKm)} km</span><span class="num">${wt.doneCount} / ${wt.planCount} Einheiten</span><div class="meter"><i style="width:${pct}%"></i></div></div>
    <div class="dayhead"><h3>${WD_L[(d.getDay()+6)%7]}<small>${fmtDM(d)}</small></h3>${ds===ts ? '<span class="todaytag">Heute</span>' : ""}</div>
    <div class="mscroll" id="mWeekDay">${items.map(cardHtml).join("") || `<div class="mempty">Für diesen Tag ist nichts geplant.</div>`}<button class="add" data-add="${ds}">+ Einheit</button></div>
    <div class="mhint"${isMin() && !M.open.week ? " hidden" : ""}>Wischen wechselt den Tag · Einheit gedrückt halten und auf einen Tag oben ziehen</div>`;
  $("mBody").querySelectorAll("[data-pick]").forEach(b => b.onclick = () => {
    const nd = parse(b.dataset.pick), dir = Math.sign(nd - M.day); if (!dir) return;
    M.day = nd; render(); slideIn(dir, "#mWeekDay");
  });
}

function mMonth(){
  const a = M.month, first = new Date(a.getFullYear(), a.getMonth(), 1), last = new Date(a.getFullYear(), a.getMonth()+1, 0);
  mHead(MONTHS[a.getMonth()], String(a.getFullYear()), true);
  const ts = iso(today()); let cells = "", d = sow(first);
  while (d <= last){
    for (let i=0;i<7;i++){
      const day = addDays(d,i), di = iso(day), items = inRange(di, di);
      cells += `<button class="${day.getMonth()!==a.getMonth()?"out":""} ${di===ts?"today":""}" data-goto="${di}" aria-label="${day.toLocaleDateString("de-DE")}"><span class="n num">${day.getDate()}</span><span class="dots">${dots(items)}</span></button>`;
    }
    d = addDays(d,7);
  }
  const T = totals(inRange(iso(first), iso(last)));
  $("mBody").innerHTML = `
    <div class="mcal">${WD.map(w => `<span class="h">${w}</span>`).join("")}${cells}</div>
    ${isMin() ? `<button class="mtoggle sm" data-tg="month" aria-expanded="${!!M.open.month}">Monatsstatistik<small>${fmtKm(T.doneKm)} km</small></button>` : ""}
    <div class="mstats"${isMin() && !M.open.month ? " hidden" : ""}>
      <div><b class="num">${fmtKm(T.doneKm)}<small>/ ${fmtKm(T.planKm)} km</small></b><span>Gelaufen</span></div>
      <div><b class="num">${T.doneCount}<small>/ ${T.planCount}</small></b><span>Einheiten</span></div>
      <div><b class="num">${T.avgPace ? fmtPaceSec(T.avgPace) : "–"}<small>/km</small></b><span>Ø Pace</span></div>
      <div><b class="num">${fmtKm(T.longest)}<small>km</small></b><span>Längster Lauf</span></div>
    </div>`;
}

function mHalf(){
  const a = M.half, y = a.getFullYear(), h = a.getMonth() < 6 ? 0 : 1;
  const first = new Date(y, h*6, 1), last = new Date(y, h*6+6, 0);
  mHead(`${h ? "2." : "1."} Halbjahr`, String(y), true);
  const arr = inRange(iso(first), iso(last)), T = totals(arr);
  // Wochenbalken
  const weeks = []; let d = sow(first);
  while (d <= last){ weeks.push({start:d, ...totals(inRange(iso(d), iso(addDays(d,6))))}); d = addDays(d,7); }
  const maxV = Math.max(10, ...weeks.map(w => Math.max(w.planKm, w.doneKm)));
  const step = maxV > 80 ? 20 : maxV > 40 ? 10 : 5, top = Math.ceil(maxV/step)*step;
  const W = 340, H = 210, L = 26, R = 4, Tp = 10, B = 26, cw = (W-L-R)/weeks.length, bw = Math.max(4, cw*0.6);
  const yv = v => Tp + (H-Tp-B) * (1 - v/top), cur = iso(sow(today()));
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Wochenkilometer geplant und gelaufen">`;
  for (let v=0; v<=top; v+=step) svg += `<line x1="${L}" x2="${W-R}" y1="${yv(v)}" y2="${yv(v)}" stroke="var(--line-soft)"/><text x="${L-5}" y="${yv(v)+3.5}" text-anchor="end" font-size="9.5" fill="var(--muted)" font-family="Lato, Helvetica, sans-serif">${v}</text>`;
  weeks.forEach((w,i) => {
    const x = L + i*cw + (cw-bw)/2, isCur = iso(w.start)===cur;
    if (w.planKm) svg += `<rect x="${x}" y="${yv(w.planKm)}" width="${bw}" height="${yv(0)-yv(w.planKm)}" rx="2" fill="none" stroke="var(--muted)" stroke-opacity=".6" stroke-dasharray="2 2.5" stroke-width="1"/>`;
    if (w.doneKm) svg += `<rect x="${x+bw/2-2}" y="${yv(w.doneKm)}" width="4" height="${yv(0)-yv(w.doneKm)}" rx="2" fill="${isCur ? "var(--bib)" : "var(--accent)"}"/>`;
    if (i%4===0) svg += `<text x="${x+bw/2}" y="${H-B+14}" text-anchor="middle" font-size="9" fill="var(--muted)" font-family="Lato, Helvetica, sans-serif">KW ${isoWeek(w.start)}</text>`;
  });
  svg += `</svg>`;
  // Monate
  const curM = `${today().getFullYear()}-${today().getMonth()}`;
  let rows = "";
  for (let m=0;m<6;m++){
    const mf = new Date(y, h*6+m, 1), ml = new Date(y, h*6+m+1, 0), mt = totals(inRange(iso(mf), iso(ml)));
    rows += `<tr class="click ${curM===`${y}-${h*6+m}`?"cur":""}" data-month="${iso(mf)}"><td>${MONTHS[h*6+m]}</td><td>${fmtKm(mt.doneKm)} / ${fmtKm(mt.planKm)}</td><td>${mt.avgPace ? fmtPaceSec(mt.avgPace) : "–"}</td><td>${mt.planCount ? Math.round(mt.doneCount/mt.planCount*100)+" %" : "–"}</td></tr>`;
  }
  rows += `<tr><td>Summe</td><td>${fmtKm(T.doneKm)} / ${fmtKm(T.planKm)}</td><td>${T.avgPace ? fmtPaceSec(T.avgPace) : "–"}</td><td>${T.planCount ? Math.round(T.doneCount/T.planCount*100)+" %" : "–"}</td></tr>`;
  // Arten
  const byType = {}; arr.filter(s => s.actual && s.type!=="rest").forEach(s => { byType[s.type] = (byType[s.type]||0) + 1; });
  const tmax = Math.max(1, ...Object.values(byType));
  const tb = Object.keys(TYPES).filter(k => byType[k]).map(k => `<div class="tb" style="--tc:var(--t-${k})"><span>${TYPES[k].label}</span><span class="bar"><i style="width:${byType[k]/tmax*100}%"></i></span><span class="n num">${byType[k]}×</span></div>`).join("") || `<p class="note">Noch keine absolvierten Einheiten in diesem Halbjahr.</p>`;

  $("mBody").innerHTML = `
    <div class="mcar" id="mCar">
      ${(() => { const A = analysis(); return `<section class="mslide"><h3>Formzeit</h3>${anaFormzeitHtml(A, true)}</section>
      <section class="mslide"><h3>Woher sie kommt</h3>${anaFactorsHtml(A, true)}</section>
      <section class="mslide"><h3>Bereitschaft</h3>${anaReadyHtml(A, true)}</section>
      <section class="mslide"><h3>Prognose</h3>${anaForecastHtml(A, true)}</section>
      <section class="mslide"><h3>Fitness</h3>${anaFitHtml(true)}</section>`; })()}
      <section class="mslide"><h3>Formcheck</h3>${formcheckHtml(true)}</section>
      <section class="mslide"><h3>Wochenkilometer</h3>
        <div class="mstats three">
      <div><b class="num">${fmtKm(T.doneKm)}<small>km</small></b><span>Gelaufen</span></div>
      <div><b class="num">${T.doneCount}<small>/ ${T.planCount}</small></b><span>Einheiten</span></div>
      <div><b class="num">${T.avgPace ? fmtPaceSec(T.avgPace) : "–"}<small>/km</small></b><span>Ø Pace</span></div>
    </div>
        <div class="legend"><span><i class="sw" style="border:1px dashed var(--muted)"></i>geplant</span><span><i class="sw" style="background:var(--accent)"></i>gelaufen</span><span><i class="sw" style="background:var(--bib)"></i>diese Woche</span></div>${svg}</section>
      <section class="mslide"><h3>Monate</h3><table><thead><tr><th>Monat</th><th>km</th><th>Pace</th><th>Quote</th></tr></thead><tbody>${rows}</tbody></table></section>
      <section class="mslide"><h3>Trainingsarten</h3><div class="typebars">${tb}</div></section>
    </div>
    <div class="mdots" aria-hidden="true">${[0,1,2,3,4,5,6,7,8].map(i => `<i class="${i===M.slide?"on":""}"></i>`).join("")}</div>`;
  const car = $("mCar");
  if (isMin()) car.querySelectorAll(".mslide").forEach(sl => {
    const h = sl.querySelector("h3");
    if (h && sl.querySelector("[data-fit], .fc-list, .legend")) h.insertAdjacentHTML("beforeend", `<button class="mtoggle sm" data-more aria-expanded="false">Details</button>`);
  });
  M.slide = Math.min(M.slide, car.children.length - 1);
  car.scrollLeft = car.children[M.slide].offsetLeft - car.offsetLeft;
  car.onscroll = () => {
    const i = Math.round(car.scrollLeft / (car.clientWidth + 16));
    if (i !== M.slide){ M.slide = i; $("mBody").querySelectorAll(".mdots i").forEach((el,k) => el.classList.toggle("on", k===i)); }
  };
  $("mBody").querySelectorAll("tr[data-month]").forEach(r => r.onclick = () => { M.month = parse(r.dataset.month); M.tab = "month"; render(); });
  requestAnimationFrame(fitSlides);
}
// Jede Seite passt ohne Scrollen: erst dichter setzen, dann Entbehrliches (data-fit, kleinste Zahl zuerst) ausblenden
function fitSlides(){
  document.querySelectorAll("#mCar .mslide").forEach(sl => {
    const over = () => sl.scrollHeight > sl.clientHeight + 1;
    if (!over()) return;
    sl.classList.add("tight");
    const drops = [...sl.querySelectorAll("[data-fit]")].sort((a, b) => a.dataset.fit - b.dataset.fit);
    for (const el of drops){ if (!over()) break; el.hidden = true; }
    if (over()) sl.classList.add("tighter");
  });
}

function mShift(dir){
  if (M.tab==="week") M.day = addDays(M.day, 7*dir);
  else if (M.tab==="month") M.month = new Date(M.month.getFullYear(), M.month.getMonth()+dir, 1);
  else if (M.tab==="half") M.half = new Date(M.half.getFullYear(), M.half.getMonth()+6*dir, 1);
  render(); slideIn(dir);
}
function slideIn(dir, sel){
  if (reduced()) return;
  const el = sel ? document.querySelector(sel) : $("mBody"); if (!el) return;
  el.animate([{transform:`translateX(${dir*40}px)`, opacity:.15}, {transform:"none", opacity:1}], {duration:220, easing:"cubic-bezier(.2,.7,.2,1)"});
}

$("mBody").addEventListener("touchend", e => {

/* =====================================================================
   Ausfall (krank, verletzt …) und Plan anpassen
   Beide arbeiten direkt auf den gespeicherten Einheiten und lassen sich rückgängig machen.
   ===================================================================== */
const PAUSE_REASONS = { sick:"Krank", injury:"Verletzt", other:"Anderes" };
const PLAN_FIELDS = ["type","title","planKm","planMin","planZone","planPace","planReps","planRepDist","desc"];
const pick = (o, keys) => Object.fromEntries(keys.map(k => [k, o[k] ?? null]));
const dayDiff = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const shortDay = ds => { const d = parse(ds); return `${WD[(d.getDay()+6)%7]} ${fmtDM(d)}`; };
const sessLabel = s => s.title || TYPES[s.type]?.label || "Einheit";
const open_ = s => !s.actual && !s.skipped && s.type !== "rest";
let lastBulk = null; // { label, before: [[id, body|null]] }

// Mehrere Änderungen auf einmal: lokal speichern, einmal zeichnen, Rücknahme merken
function applyBulk(label, changes){
  const before = changes.map(([id]) => { const s = state.sessions.get(id); return [id, s ? strip(s) : null]; });
  changes.forEach(([id, body]) => put("sessions", id, body, true));
  saveLocalDb(); applyDocs(); render(); scheduleSync(100);
  lastBulk = { label, before };
}
function undoBulk(){
  if (!lastBulk) return;
  lastBulk.before.forEach(([id, body]) => put("sessions", id, body, true));
  saveLocalDb(); applyDocs(); render(); scheduleSync(100);
  toast("Rückgängig gemacht: " + lastBulk.label); lastBulk = null;
}

/* Ausfall: Einheiten im Zeitraum fallen aus, danach sanfter Wiedereinstieg.
   Faustregel: so viele Tage locker, wie du ausgefallen bist (mind. 3, höchstens 14).
   Erste Hälfte 70 % Umfang, zweite Hälfte 85 %; Intervalle und Tempo werden zu lockeren Läufen. */
function pausePlan(P){
  if (!P.from || !P.to || P.to < P.from) return { skip:[], adjust:[], span:0 };
  const skip = inRange(P.from, P.to).filter(open_).sort(byDate);
  const n = dayDiff(P.from, P.to) + 1, span = P.ease ? Math.min(14, Math.max(3, n)) : 0;
  const a = iso(addDays(parse(P.to), 1)), b = iso(addDays(parse(P.to), span));
  const adjust = [];
  if (span) inRange(a, b).filter(s => open_(s) && !s.adj && RUN(s) && s.type !== "race").sort(byDate).forEach(s => {
    const f = dayDiff(a, s.date) < span / 2 ? 0.7 : 0.85;
    const km = s.planKm ? Math.max(3, Math.round(s.planKm * f)) : null;
    const body = { ...strip(s), adj:{ reason:P.reason, orig:pick(s, PLAN_FIELDS) } };
    if (isHard(s)){
      Object.assign(body, { type:"easy", title:"Locker statt " + sessLabel(s), planReps:null, planRepDist:null, planPace:null,
        planZone: mpSec() ? "easy" : null, planKm: km, planMin: km ? null : (s.planMin ? Math.round(s.planMin * f) : null),
        desc:`Wiedereinstieg nach dem Ausfall: ganz locker, Puls Zone 2, kein Tempo. Fühlst du dich noch schlapp, lass die Einheit ausfallen.` });
    } else {
      Object.assign(body, { planKm: km, planMin: !km && s.planMin ? Math.round(s.planMin * f) : s.planMin });
    }
    adjust.push({ s, body, f });
  });
  return { skip, adjust, span };
}

let P = null, PT = null, toolArm = false;

/* Plan anpassen: Änderungen für einen ganzen Zeitraum */
const PLAN_ACTS = { add:"Hinzufügen", remove:"Entfernen", retype:"Art ändern", scale:"Umfang", move:"Wochentag" };
function planEnd(){ const st = state.settings || {}; const last = list().reduce((a, s) => s.date > a ? s.date : a, iso(today())); return st.raceDate && st.raceDate < last ? st.raceDate : last; }
function openPlanTool(){
  PT = PT || { act:"remove", type:"strength", newType:"boulder", pct:-10, wdFrom:2, wdTo:1, wd:4, km:6, min:60 };
  PT.from = iso(today()); PT.to = planEnd(); toolArm = false;
  renderPlanTool(); if (!$("toolDlg").open){ $("toolDlg").showModal(); focusHead("toolBody"); }
}
const typeMatch = (s, t) => t === "runs" ? RUN(s) && s.type !== "race" : t === "all" ? s.type !== "race" && s.type !== "rest" : s.type === t;
function planChanges(){
  const t = PT, out = [];
  if (!t.from || !t.to || t.to < t.from) return out;
  if (t.act === "add"){
    // In jeder Woche des Zeitraums am gewählten Wochentag, wenn dort noch keine Einheit dieser Art liegt
    for (let d = addDays(sow(parse(t.from)), t.wd); iso(d) <= t.to; d = addDays(d, 7)){
      const ds = iso(d); if (ds < t.from) continue;
      if (inRange(ds, ds).some(s => s.type === t.newType)) continue;
      const nr = NONRUN.has(t.newType);
      out.push([newId(), { date:ds, type:t.newType, title:"", planKm: nr ? null : (+t.km || null), planMin: nr ? (+t.min || null) : null,
        planZone: !nr && mpSec() && TYPE_ZONE[t.newType] ? TYPE_ZONE[t.newType] : null, planPace:null, planReps:null, planRepDist:null,
        desc:"", example:false, created:Date.now(), actual:null }, null]);
    }
    return out;
  }
  inRange(t.from, t.to).filter(s => open_(s) && typeMatch(s, t.type)).sort(byDate).forEach(s => {
    if (t.act === "remove") out.push([s.id, null, s]);
    else if (t.act === "retype"){
      if (s.type === t.newType) return;
      const nr = NONRUN.has(t.newType);
      out.push([s.id, { ...strip(s), type:t.newType, title:"", planReps:null, planRepDist:null,
        planKm: nr ? null : s.planKm ?? null, planPace: nr ? null : s.planPace ?? null,
        planZone: nr ? null : (mpSec() && TYPE_ZONE[t.newType] ? TYPE_ZONE[t.newType] : s.planZone ?? null) }, s]);
    } else if (t.act === "scale"){
      const f = 1 + t.pct / 100, km = s.planKm ? Math.max(1, Math.round(s.planKm * f * 2) / 2) : null;
      const mn = !s.planKm && s.planMin ? Math.max(5, Math.round(s.planMin * f / 5) * 5) : s.planMin ?? null;
      if (km === (s.planKm ?? null) && mn === (s.planMin ?? null)) return;
      out.push([s.id, { ...strip(s), planKm:km, planMin:mn }, s]);
    } else if (t.act === "move"){
      const wd = (parse(s.date).getDay() + 6) % 7; if (wd !== t.wdFrom || t.wdFrom === t.wdTo) return;
      out.push([s.id, { ...strip(s), date: iso(addDays(parse(s.date), t.wdTo - t.wdFrom)) }, s]);
    }
  });
  return out;
}
function renderPlanTool(){

      <div class="row">${NONRUN.has(t.newType) ? `<label>Dauer (min)<input type="number" id="t_min" min="5" step="5" value="${t.min}" inputmode="numeric"></label>` : `<label>Distanz (km)<input type="number" id="t_km" min="1" step="0.5" value="${t.km}" inputmode="decimal"></label>`}</div>`;

    if (t.act === "move") fields += `<div class="row"><label>Von<select id="t_wdf">${wdOpts(t.wdFrom)}</select></label><label>Auf<select id="t_wdt">${wdOpts(t.wdTo)}</select></label></div>`;
  }
  const verb = { add:"neu", remove:"werden entfernt", retype:"bekommen die neue Art", scale:"werden angepasst", move:"werden verschoben" }[t.act];
  const rows = ch.slice(0, 8).map(([id, body, s]) => {
    const d = (body || s).date, lbl = s ? sessLabel(s) : TYPES[body.type].label;
    const what = t.act === "scale" ? (s.planKm ? `${fmtKm(s.planKm)} → ${fmtKm(body.planKm)} km` : `${s.planMin} → ${body.planMin} min`)
      : t.act === "move" ? `→ ${shortDay(body.date)}` : t.act === "retype" ? `→ ${TYPES[body.type].label}` : t.act === "remove" ? "entfernt" : (body.planKm ? fmtKm(body.planKm) + " km" : body.planMin ? body.planMin + " min" : "neu");
    return `<li><span>${shortDay(d)}</span><b>${esc(lbl)}</b><em class="${t.act === "remove" ? "x" : ""}">${what}</em></li>`;
  }).join("");
  $("toolBody").innerHTML = `${grab}<h3>Plan anpassen</h3>
    <div class="feel" id="t_act">${Object.entries(PLAN_ACTS).map(([k, v]) => `<button type="button" data-a="${k}" aria-pressed="${t.act===k}">${v}</button>`).join("")}</div>
    <div class="row"><label>Ab<input type="date" id="t_from" value="${t.from}"></label><label>Bis<input type="date" id="t_to" value="${t.to}"></label></div>
    ${fields}
    <p class="hint">${ch.length ? `${ch.length} ${ch.length === 1 ? "Einheit" : "Einheiten"} ${verb}${ch.length ? ` (KW ${isoWeek(parse((ch[0][1]||ch[0][2]).date))}–${isoWeek(parse((ch[ch.length-1][1]||ch[ch.length-1][2]).date))})` : ""}.` : "Keine passenden Einheiten im Zeitraum."} Erledigte und ausgefallene Einheiten bleiben unverändert.</p>
    ${rows ? `<ul class="plist">${rows}${ch.length > 8 ? `<li class="more">… und ${ch.length - 8} weitere</li>` : ""}</ul>` : ""}
    ${lastBulk ? `<button type="button" class="linkbtn" id="t_undo">Rückgängig: ${esc(lastBulk.label)}</button>` : ""}
    <div class="actions"><div class="r"><button type="button" class="btn" id="t_close">Fertig</button>
      <button type="button" class="btn primary ${toolArm ? "armed" : ""}" id="t_apply" ${ch.length ? "" : "disabled"}>${toolArm ? "Wirklich ändern?" : "Anwenden"}</button></div></div>`;
  const re = () => { toolArm = false; renderPlanTool(); };
  $("t_act").querySelectorAll("button").forEach(b => b.onclick = () => { t.act = b.dataset.a; re(); });
  $("t_from").onchange = e => { t.from = e.target.value; re(); };
  $("t_to").onchange = e => { t.to = e.target.value; re(); };
  const bind = (id, k, num) => { if ($(id)) $(id).onchange = e => { t[k] = num ? +e.target.value : e.target.value; re(); }; };
  bind("t_type", "type"); bind("t_new", "newType"); bind("t_wd", "wd", true); bind("t_wdf", "wdFrom", true); bind("t_wdt", "wdTo", true); bind("t_km", "km", true); bind("t_min", "min", true);
  if ($("t_pct")) $("t_pct").querySelectorAll("button").forEach(b => b.onclick = () => { t.pct = +b.dataset.p; re(); });

  $("t_apply").onclick = () => {

    renderPlanTool();
  };
}

/* Blätter nach unten wischen zum Schließen */
function sheetSwipe(dlg){
  let y0 = null, x0 = 0, dy = 0, active = false;
  dlg.addEventListener("touchstart", e => {
    if (!PHONE.matches || e.touches.length > 1 || e.target.closest("input,textarea,select,.palette")){ y0 = null; return; }
    y0 = e.touches[0].clientY; x0 = e.touches[0].clientX; dy = 0; active = false;
  }, {passive:true});
  dlg.addEventListener("touchmove", e => {
    if (y0 === null) return;
    const d = e.touches[0].clientY - y0, dx = e.touches[0].clientX - x0;
    if (!active){
      if (d > 8 && d > Math.abs(dx) && dlg.scrollTop <= 0){ active = true; dlg.classList.remove("sheet-back"); }
      else if (Math.abs(d) > 8 || Math.abs(dx) > 8){ y0 = null; return; }
      else return;
    }
    e.preventDefault(); dy = Math.max(0, d); dlg.style.transform = `translateY(${dy}px)`;
  }, {passive:false});
  const end = () => {
    if (y0 === null) return; y0 = null; if (!active) return; active = false;
    dlg.classList.add("sheet-back");
    if (dy > 110){ dlg.style.transform = "translateY(105%)"; setTimeout(() => { dlg.close(); dlg.style.transform = ""; dlg.classList.remove("sheet-back"); }, 210); }
    else { dlg.style.transform = ""; setTimeout(() => dlg.classList.remove("sheet-back"), 240); }
  };
  dlg.addEventListener("touchend", end); dlg.addEventListener("touchcancel", end);
}

["dlg","raceDlg","moreDlg","toolDlg"].forEach(id => sheetSwipe($(id)));

/* ---------- Zeitfelder: Doppelpunkte setzen sich selbst ---------- */
// Nur Ziffern tippen: "05230" wird 0:52:30, "130" wird 1:30 (Kraft/Bouldern), "530" wird 5:30 (Pace)
const MASKS = { hms:[1,2,2], hm:[1,2], ms:[1,2] };
function maskDigits(d, groups){
  const out = []; let i = 0;
  for (const g of groups){ if (i >= d.length) break; out.push(d.slice(i, i+g)); i += g; }
  return out.join(":");
}
document.addEventListener("input", e => {
  const el = e.target; if (!el.matches || !el.matches("input[data-mask]")) return;
  const groups = MASKS[el.dataset.mask]; if (!groups) return;
  const max = groups.reduce((a,b) => a+b, 0);
  let d = el.value.replace(/\D/g, "").slice(0, max);
  // Rückschritt auf einen Doppelpunkt löscht die Ziffer davor mit
  if (e.inputType === "deleteContentBackward" && d === (el.dataset.prev || "") && d.length) d = d.slice(0, -1);
  el.value = maskDigits(d, groups); el.dataset.prev = d;
  try { el.setSelectionRange(el.value.length, el.value.length); } catch(err){}
  // Alle Ziffern eingegeben (z. B. 5 bei h:mm:ss): Eingabe fertig, Tastatur schließen
  if (d.length === max && !(e.inputType || "").startsWith("delete")) setTimeout(() => el.blur(), 120);
}, true);
document.addEventListener("focusin", e => { const el = e.target; if (el.matches && el.matches("input[data-mask]")) el.dataset.prev = el.value.replace(/\D/g, ""); });

   Formcheck: feste Ziele, regelbasiert, ohne KI, läuft komplett offline

const GOALS = {

  planWarn: 0.70,     //   70–90 % gelb, darunter rot
  easyFaster: 15,     // lockerer Lauf höchstens 15 s/km schneller als geplant
  easyRpe: 5,         // lockerer Lauf: Anstrengung höchstens 5 von 10
  hardRpe: 9,         // harte Einheit ab RPE 9: zu ehrgeizig
  overPlan: 0.15,     // höchstens 15 % mehr Kilometer als geplant
  longMin: 0.90,      // langer Lauf mindestens 90 % der geplanten Distanz
  strengthMin: 0.75,  // Kraft & Stabi: mindestens 75 % der geplanten Einheiten
  heavyFeel: 2        // Gefühl "Schwer" oder "Zäh"
};
const RUN = s => !NONRUN.has(s.type) && s.type !== "cross";
const isEasy = s => s.type === "easy";
const isHard = s => s.type === "interval" || s.type === "tempo";
const paceOf = a => a && a.km && a.sec ? a.sec / a.km : 0;
const LV = { ok:2, warn:1, bad:0 };

function phaseInfo(){
  const rd = state.settings && state.settings.raceDate;
  if (!rd) return null;
  const days = Math.round((parse(rd) - today()) / 864e5), w = Math.floor(days / 7);
  const name = days < 0 ? "Nach dem Rennen" : w <= 0 ? "Rennwoche" : w <= 3 ? "Tapering" : w <= 18 ? "Marathonvorbereitung" : "Grundlagenphase";
  return { days, weeks: w, name };
}

/* Rückmeldung zu einer einzelnen Einheit */
function sessionFeedback(s){
  const a = s && s.actual; if (!a) return null;
  const notes = []; let level = "ok";
  const warn = t => { notes.push(t); if (level === "ok") level = "warn"; };
  const pace = paceOf(a), pp = planPace(s), hrMax = +(state.settings && state.settings.easyHrMax) || 0;
  if (NONRUN.has(s.type)){
    notes.push(s.type === "strength" ? "Kraft & Stabi erledigt. Das schützt Knie und Sprunggelenk." : "Erledigt. Gute Abwechslung zum Laufen.");
  } else if (isEasy(s)){
    let fine = true;
    if (pace && pp && pace < pp - GOALS.easyFaster){ warn(`Etwas schnell für einen lockeren Lauf: ${fmtPaceSec(pace)} statt ~${fmtPaceSec(pp)} /km.`); fine = false; }
    if (a.hr && hrMax && a.hr > hrMax){ warn(`Ø Puls ${a.hr} liegt über deiner Grenze von ${hrMax}.`); fine = false; }
    if (a.rpe && a.rpe > GOALS.easyRpe){ warn(`Anstrengung ${a.rpe}/10 ist hoch für einen lockeren Lauf.`); fine = false; }
    if (fine) notes.push(`Schön locker${pace ? ": " + fmtPaceSec(pace) + " /km" : ""}${a.hr ? ", Puls " + a.hr : ""}.`);
  } else if (isHard(s)){
    notes.push("Harte Einheit erledigt.");
    if (a.rpe >= GOALS.hardRpe) warn(`Sehr hart (${a.rpe}/10). Geh die Wiederholungen beim nächsten Mal etwas ruhiger an.`);
    else if (a.rpe && a.rpe <= 5) notes.push("Fühlte sich leicht an: ein gutes Zeichen für deine Form.");
  } else if (s.type === "race" && a.km >= 5 && a.sec){
    const r = raceToMarathon(a.sec, +a.km, (analysis().act || {}).kmWeek || 0), g = goalSec(state.settings && state.settings.goal);
    notes.push(a.km >= 40 ? `${fmtPaceSec(pace)} /km. Glückwunsch zum Marathon!` : `${fmtPaceSec(pace)} /km. Hochgerechnet auf den Marathon: etwa ${fmtHM(r.est - 15*60)}–${fmtHM(r.est + 15*60)} h${g ? (r.est <= g + 5*60 ? ", im Bereich deiner Zielzeit." : ` (Ziel ${fmtHM(g)}).`) : "."}`);
    const so = splitOf(s);
    if (so) (so.level === "bad" ? warn : t => notes.push(t))(`Zweite Hälfte ${pctStr(so.pct, 1)} gegenüber der ersten${so.level === "ok" ? ": gut eingeteilt." : so.level === "warn" ? ", im üblichen Rahmen." : ". Beim nächsten Mal ruhiger anlaufen."}`);
  }
  if (RUN(s) && a.km && s.planKm){
    const r = a.km / s.planKm;
    if (r < 0.85) warn(`Kürzer als geplant (${fmtKm(a.km)} von ${fmtKm(s.planKm)} km).`);
    else if (r > 1 + GOALS.overPlan) warn(`Länger als geplant (${fmtKm(a.km)} statt ${fmtKm(s.planKm)} km).`);
  }
  const sp = spikeOf(s);
  if (sp && sp.level !== "ok") warn(`${fmtKm(sp.km)} km sind ${pctStr(sp.pct)} mehr als dein längster Lauf der 30 Tage davor (${fmtKm(sp.base)} km). Steigere einzelne Läufe lieber in kleineren Schritten.`);
  const pain = (a.tags||[]).filter(t => t !== "tired").map(t => TAGS[t]);
  if (pain.length) warn(`${pain.join(" und ")} notiert. Wird es beim Einlaufen besser: Umfang halbieren, kein Tempo. Stechend oder schlimmer: pausieren und abklären.`);
  if ((a.tags||[]).includes("tired")) warn("Schlapp notiert. Ein zusätzlicher Ruhetag ist jetzt oft die beste Einheit.");
  if (a.feel && a.feel <= GOALS.heavyFeel) warn("Hat sich schwer angefühlt. Häufen sich solche Tage, lieber einen Ruhetag einschieben.");
  return { level, text: notes.join(" ") };
}

/* Wochen- und Trendauswertung */
function formcheck(){
  const t = today(), curStart = sow(t), lastStart = addDays(curStart, -7);
  // Ausgefallene Einheiten (krank o. Ä.) zählen nicht als verpasst
  const act = arr => arr.filter(s => !isSkipped(s));
  const rng = (a, days) => act(inRange(iso(a), iso(addDays(a, days - 1))));
  const lastWeek = rng(lastStart, 7), last14 = act(inRange(iso(addDays(t, -14)), iso(addDays(t, -1))).concat(inRange(iso(t), iso(t))));
  const last28 = act(inRange(iso(addDays(curStart, -28)), iso(addDays(curStart, -1))));
  const logged = list().filter(s => s.actual && RUN(s));
  const checks = [];
  const add = (key, title, goal, level, text) => checks.push({ key, title, goal, level, text });

  // 1 Planerfüllung letzte Woche
  const runsLW = lastWeek.filter(RUN), planKm = runsLW.reduce((n, s) => n + (+s.planKm || 0), 0), doneKm = runsLW.reduce((n, s) => n + (s.actual && +s.actual.km || 0), 0);
  const allLW = lastWeek.filter(s => s.type !== "rest"), doneLW = allLW.filter(s => s.actual).length;
  if (planKm > 0){
    const r = doneKm / planKm;
    add("plan", "Plan erfüllt", `mind. ${Math.round(GOALS.planMin*100)} % der Kilometer`, r >= GOALS.planMin ? "ok" : r >= GOALS.planWarn ? "warn" : "bad",
      `KW ${isoWeek(lastStart)}: ${fmtKm(doneKm)} von ${fmtKm(planKm)} km (${Math.round(r*100)} %), ${doneLW} von ${allLW.length} Einheiten.`);
    // 2 Umfang im Rahmen
    const over = doneKm - planKm;
    add("volume", "Umfang im Rahmen", `höchstens ${Math.round(GOALS.overPlan*100)} % über Plan`, over > Math.max(3, planKm * GOALS.overPlan) ? (over > planKm * 0.3 ? "bad" : "warn") : "ok",
      over > Math.max(3, planKm * GOALS.overPlan) ? `${fmtKm(over)} km mehr als geplant. Zu schnelle Steigerung erhöht das Verletzungsrisiko.` : "Kein Ausreißer nach oben.");
  }

  // 3 Lockere Läufe locker (14 Tage)
  const easy = last14.filter(s => isEasy(s) && s.actual), hrMax = +(state.settings && state.settings.easyHrMax) || 0;
  if (easy.length){
    const tooFast = easy.filter(s => { const p = paceOf(s.actual), pp = planPace(s); return (p && pp && p < pp - GOALS.easyFaster) || (hrMax && s.actual.hr > hrMax) || (s.actual.rpe > GOALS.easyRpe); });
    add("easy", "Locker bleibt locker", `max. ${GOALS.easyFaster} s/km schneller als geplant${hrMax ? ", Puls ≤ " + hrMax : ""}, RPE ≤ ${GOALS.easyRpe}`,
      !tooFast.length ? "ok" : tooFast.length * 2 > easy.length ? "bad" : "warn",
      tooFast.length ? `${tooFast.length} von ${easy.length} lockeren Läufen ${tooFast.length === 1 ? "war" : "waren"} zu flott oder zu anstrengend.` : (easy.length === 1 ? "Der lockere Lauf war im grünen Bereich." : `Alle ${easy.length} lockeren Läufe im grünen Bereich.`));
  }

  // 4 Harte Einheiten
  const hardPlanned = last14.filter(s => isHard(s) && s.date < iso(t)), hardDone = hardPlanned.filter(s => s.actual);
  if (hardPlanned.length){
    const tooHard = hardDone.filter(s => s.actual.rpe >= GOALS.hardRpe);
    add("hard", "Tempo-Einheiten", "geplante Einheiten erledigt, RPE unter " + GOALS.hardRpe,
      hardDone.length < hardPlanned.length ? "warn" : tooHard.length ? "warn" : "ok",
      `${hardDone.length} von ${hardPlanned.length} erledigt${tooHard.length ? ", " + tooHard.length + "× sehr hart" : ""}.`);
  }

  // 5 Langer Lauf (4 Wochen)
  const runs28 = last28.filter(RUN), longPlan = Math.max(0, ...runs28.map(s => +s.planKm || 0)), longDone = Math.max(0, ...runs28.filter(s => s.actual).map(s => +s.actual.km || 0));
  if (longPlan >= 10){
    const r = longDone / longPlan;
    add("long", "Langer Lauf", `mind. ${Math.round(GOALS.longMin*100)} % der längsten geplanten Distanz`, r >= GOALS.longMin ? "ok" : r >= 0.75 ? "warn" : "bad",
      `Längster Lauf der letzten 4 Wochen: ${fmtKm(longDone)} km (geplant ${fmtKm(longPlan)} km).`);
  }

  // 6 Kraft & Stabi (14 Tage)
  const str = last14.filter(s => s.type === "strength" && (s.date < iso(t) || s.actual)), strDone = str.filter(s => s.actual).length;
  if (str.length){
    const r = strDone / str.length;
    add("strength", "Kraft & Stabi", `mind. ${Math.round(GOALS.strengthMin*100)} % der Einheiten`, r >= GOALS.strengthMin ? "ok" : r >= 0.5 ? "warn" : "bad",
      `${strDone} von ${str.length} Einheiten in den letzten 14 Tagen.`);
  }

  // 7 Erholung: Gefühl der letzten 5 Einheiten
  const recent = list().filter(s => s.actual && s.actual.feel).sort(byDate).slice(-5);
  if (recent.length >= 3){
    const heavy = recent.filter(s => s.actual.feel <= GOALS.heavyFeel).length;
    add("feel", "Erholung", "höchstens 1 von 5 Einheiten schwer", heavy >= 3 ? "bad" : heavy === 2 ? "warn" : "ok",
      heavy ? `${heavy} der letzten ${recent.length} Einheiten ${heavy === 1 ? "fühlte" : "fühlten"} sich schwer an.` : "Du fühlst dich zuletzt gut.");
  }

  // Prognose: siehe Analyse (Wettkampf und Training im Vergleich mit Referenzdaten)
  const forecast = analysis().fc;

  // Gesamturteil
  const scored = checks.map(c => LV[c.level]);
  const bad = checks.filter(c => c.level === "bad").length, warn = checks.filter(c => c.level === "warn").length;
  let verdict;
  if (logged.length < 3 || checks.length < 2) verdict = { level:"na", label:"Noch zu wenig Daten", text:"Nach ein paar eingetragenen Läufen siehst du hier, ob du auf Kurs bist." };
  else if (bad >= 2) verdict = { level:"bad", label:"Gegensteuern", text:"Mehrere Ziele sind gerissen. Schau dir unten an, wo es hakt." };
  else if (bad || warn >= 2) verdict = { level:"warn", label:"Achtung", text:"Grundsätzlich auf dem Weg, aber ein paar Punkte solltest du im Blick behalten." };
  else verdict = { level:"ok", label:"Auf Kurs", text:"Du setzt den Plan gut um. Weiter so." };
  const score = scored.length ? Math.round(scored.reduce((a, b) => a + b, 0) / (scored.length * 2) * 100) : null;
  return { verdict, checks, phase: phaseInfo(), forecast, score };
}

const LV_LABEL = { ok:"Im Ziel", warn:"Knapp", bad:"Verfehlt", na:"–" };
function formcheckHtml(compact){
  const f = formcheck(), ph = f.phase, g = goalSec(state.settings && state.settings.goal);
  const head = `<div class="fc-head fc-${f.verdict.level}">
      <span class="fc-dot"></span>
      <div><div class="fc-label">${f.verdict.label}</div><div class="fc-text" data-fit="3">${f.verdict.text}</div></div>
      ${f.score !== null && f.verdict.level !== "na" ? `<div class="fc-score num">${f.score}<small>%</small></div>` : ""}
    </div>
    ${ph ? `<div class="fc-meta" data-fit="4">${ph.days >= 0 ? `Noch ${ph.weeks} Wochen bis zum Rennen` : "Rennen vorbei"} · ${ph.name}${f.forecast ? ` · Prognose ${fmtHM(f.forecast.lo)}–${fmtHM(f.forecast.hi)}${g ? " (Ziel " + fmtHM(g) + ")" : ""}` : ""}</div>` : ""}`;
  const rows = f.checks.map(c => `<div class="fc-row fc-${c.level}">
      <span class="fc-dot"></span>
      <div class="fc-body"><div class="fc-t">${c.title}<span class="fc-lv">${LV_LABEL[c.level]}</span></div>
      <div class="fc-x"${compact && c.level === "ok" ? ' data-fit="2"' : ""}>${esc(c.text)}</div>${compact ? "" : `<div class="fc-goal">Ziel: ${esc(c.goal)}</div>`}</div></div>`).join("");
  return head + (rows ? `<div class="fc-list">${rows}</div>` : `<p class="note">Sobald Einheiten aus der letzten Woche eingetragen sind, erscheinen hier die einzelnen Ziele.</p>`)
    + `<p class="note fc-foot" data-fit="1">Ausgewertet wird direkt auf deinem Gerät nach festen Regeln, ohne KI und ohne dass Daten das Gerät verlassen.${!(state.settings && state.settings.easyHrMax) ? " Tipp: Trag unter Wettkampf & Ziele deine Puls-Obergrenze für lockere Läufe ein." : ""}</p>`;
}

/* =====================================================================
   Analyse: Vergleich mit Referenzdaten aus Studien. Läuft komplett offline,
   regelbasiert, ohne KI. Herleitung und Quellen: Projekt-Dokument
   „Analyse – Referenzdaten“.
   ===================================================================== */
const REF = {
  // Typische Trainingswerte je Zielzeit (Gruppenmittel). min = Zielzeit in Minuten.
  // km: Ø Wochen-km · easy: Anteil lockerer km in % · q: Qualitätseinheiten/Woche · days: Lauftage/Woche
  bands: [
    { min:170, km:100, easy:80, q:2.5,  days:6.5 },  // unter 3:00
    { min:195, km:68,  easy:70, q:2,    days:6   },  // 3:00–3:30
    { min:225, km:55,  easy:62, q:1.5,  days:5   },  // 3:30–4:00
    { min:255, km:40,  easy:55, q:0.5,  days:3.5 },  // 4:00–4:30
    { min:300, km:22,  easy:50, q:0.25, days:3   }   // um 5:00
  ],
  weights: { km:0.55, days:0.2, easy:0.15, q:0.1 },  // Umfang ist der stärkste Einzelfaktor
  spread: 20,          // Unschärfe der Einordnung in Minuten (±)
  rangeMin: 160, rangeMax: 320,
  riegelK: 1.06,       // Riegel: gut kalibriert bis zum Halbmarathon
  hmFactor: 2.19,      // Marathon ≈ Halbmarathon × 2,19 (Vickers & Vertosick 2016)
  volAdj: { low:40, lowSec:6*60, high:65, highSec:-14*60 }, // < 40 km/Woche +6 min, > 65 km/Woche −14 min
  ready: { longGood:30, longMin:25, kmGood:40, kmMin:30, avgRun:10, avgRunMin:8, q:1, taperLo:40, taperHi:60 },
  spike: { warn:10, bad:30 },   // Garmin-RUNSAFE 2025: Lauf > 10 % über dem längsten der letzten 30 Tage
  split: { men:10.7, women:8.3 }, // Berlin-Marathon 1999–2025: mittlere Verlangsamung
  weeks: 12            // Auswertungsfenster
};
const isRace = s => s.type === "race";
const isQuality = s => s.type === "interval" || s.type === "tempo";
const fmtMinHM = min => fmtHM(min * 60);

// Zeit (min), die zu einem Trainingswert passt: lineare Interpolation zwischen den Bändern
function bandTime(key, v){
  const b = REF.bands;
  if (!(v > 0)) return b[b.length-1].min;
  if (v >= b[0][key]) return b[0].min;
  for (let i = 0; i < b.length - 1; i++){
    const hi = b[i][key], lo = b[i+1][key];
    if (v <= hi && v >= lo) return hi === lo ? b[i].min : b[i].min + (hi - v) / (hi - lo) * (b[i+1].min - b[i].min);
  }
  return b[b.length-1].min;
}

// Kennzahlen eines Zeitraums. src "actual" = gelaufene Werte, "plan" = Planwerte
function trainMetrics(from, to, src){
  const weeks = Math.max(1, Math.round((parse(to) - parse(from)) / 864e5 + 1) / 7);
  const runs = inRange(from, to).filter(s => RUN(s) && !isRace(s) && !(s.skipped && !s.actual)).map(s => {
    const km = src === "plan" ? +s.planKm || 0 : (s.actual ? +s.actual.km || 0 : 0);
    return { s, km };
  }).filter(r => r.km > 0);
  const total = runs.reduce((n, r) => n + r.km, 0);
  const easyKm = runs.filter(r => r.s.type === "easy").reduce((n, r) => n + r.km, 0);
  const wk = new Map();
  runs.forEach(r => { const k = iso(sow(parse(r.s.date))); wk.set(k, (wk.get(k) || 0) + r.km); });
  return {
    weeks, runs: runs.length, total,
    kmWeek: total / weeks,
    easy: total ? easyKm / total * 100 : 0,
    q: runs.filter(r => isQuality(r.s)).length / weeks,
    days: new Set(runs.map(r => r.s.date)).size / weeks,
    longest: Math.max(0, ...runs.map(r => r.km)),
    avgRun: runs.length ? total / runs.length : 0,
    peakWeek: Math.max(0, ...wk.values())
  };
}
// Gelaufen: die letzten 12 abgeschlossenen Wochen, frühestens ab dem ersten eingetragenen Lauf
function actualWindow(ref = today()){
  const end = addDays(sow(ref), -1);
  let start = addDays(sow(ref), -7 * REF.weeks);
  const first = list().filter(s => s.actual && RUN(s) && +s.actual.km > 0).map(s => s.date).sort()[0];
  if (first && parse(first) > start) start = sow(parse(first));
  if (start > end) return null;
  return { from: iso(start), to: iso(end) };
}
// Plan: die 12 Wochen vor der Rennwoche
function planWindow(){
  const rd = state.settings && state.settings.raceDate; if (!rd) return null;
  const rw = sow(parse(rd));
  return { from: iso(addDays(rw, -7 * REF.weeks)), to: iso(addDays(rw, -1)) };
}
// Einordnung: welche Zielzeit passt typischerweise zu diesem Training?
function equivalent(m){
  const parts = [
    { key:"km",   label:"Wochenumfang",      val:m.kmWeek, txt:`${fmtKm(m.kmWeek)} km/Woche` },
    { key:"days", label:"Lauftage",          val:m.days,   txt:`${fmtKm(m.days)} pro Woche` },
    { key:"easy", label:"Anteil locker",     val:m.easy,   txt:`${Math.round(m.easy)} % der km` },
    { key:"q",    label:"Qualitätseinheiten", val:m.q,     txt:`${fmtKm(m.q)} pro Woche` }
  ].map(p => ({ ...p, min: bandTime(p.key, p.val), w: REF.weights[p.key] }));
  const mid = parts.reduce((n, p) => n + p.min * p.w, 0) / parts.reduce((n, p) => n + p.w, 0);
  return { mid, lo: mid - REF.spread, hi: mid + REF.spread, parts };
}

// Prognose: Wettkampf (Riegel bis HM, dann × 2,19, Umfangskorrektur) kombiniert mit der Einordnung
function volAdjust(kmWeek){
  const v = REF.volAdj;
  if (!(kmWeek > 0)) return 0;
  return kmWeek < v.low ? v.lowSec : kmWeek > v.high ? v.highSec : 0;
}
function raceToMarathon(sec, km, kmWeek){
  if (km >= 40) return { est: sec * Math.pow(42.195 / km, REF.riegelK), opt: sec * Math.pow(42.195 / km, REF.riegelK), adj: 0 };
  const hm = sec * Math.pow(21.0975 / km, REF.riegelK), adj = volAdjust(kmWeek);
  return { est: hm * REF.hmFactor + adj, opt: sec * Math.pow(42.195 / km, REF.riegelK), adj };
}
// Ergebnis je Datenstand und Stichtag zwischenspeichern (der Verlauf ruft die Analyse für viele Wochen auf)
let anaCache = new WeakMap();
function analysis(ref = today()){
  const key = iso(ref) + "|" + ((state.settings && state.settings.raceDate) || "");
  let c = anaCache.get(state.sessions); if (!c){ c = new Map(); anaCache.set(state.sessions, c); }
  if (!c.has(key)) c.set(key, analysisAt(ref));
  return c.get(key);
}
function analysisAt(ref){
  const aw = actualWindow(ref), pw = planWindow();
  const act = aw ? trainMetrics(aw.from, aw.to, "actual") : null;
  const plan = pw ? trainMetrics(pw.from, pw.to, "plan") : null;
  const enough = act && act.weeks >= 3 && act.runs >= 6;
  const eqAct = enough ? equivalent(act) : null;
  const eqPlan = plan && plan.runs >= 6 ? equivalent(plan) : null;
  // Wettkämpfe ab 5 km aus den 16 Wochen vor dem Stichtag
  const t = ref;
  const races = list().filter(s => isRace(s) && s.actual && +s.actual.km >= 5 && s.actual.sec && s.date <= iso(t) && s.date >= iso(addDays(t, -112)))
    .map(s => ({ s, ...raceToMarathon(s.actual.sec, +s.actual.km, act ? act.kmWeek : 0) })).sort((a, b) => a.est - b.est);
  const race = races[0] || null;
  let fc = null;
  if (race && eqAct){ const mid = race.est * 0.7 + eqAct.mid * 60 * 0.3; fc = { mid, lo: mid - 15*60, hi: mid + 15*60, basis:"Wettkampf und Training" }; }
  else if (race) fc = { mid: race.est, lo: race.est - 15*60, hi: race.est + 20*60, basis:"Wettkampf" };
  else if (eqAct) fc = { mid: eqAct.mid * 60, lo: eqAct.lo * 60, hi: eqAct.hi * 60, basis:"Training" };
  return { aw, pw, act, plan, eqAct, eqPlan, race, fc };
}

// Einzelner Lauf im Vergleich zum längsten Lauf der 30 Tage davor (vergangene: gelaufen, künftige: geplant)
function runKmOf(s, ts){
  if (s.actual) return +s.actual.km || 0;
  if (s.skipped) return 0;
  return s.date >= ts ? +s.planKm || 0 : 0;
}
function spikeOf(s){
  if (!s || !RUN(s) || isRace(s)) return null;
  const ts = iso(today()), km = runKmOf(s, ts); if (km < 5) return null;
  const from = iso(addDays(parse(s.date), -30));
  const base = Math.max(0, ...list().filter(x => x.id !== s.id && RUN(x) && x.date >= from && x.date < s.date).map(x => runKmOf(x, ts)));
  if (!base) return null;
  const pct = (km / base - 1) * 100;
  const level = pct > REF.spike.bad ? "bad" : pct > REF.spike.warn ? "warn" : "ok";
  return { km, base, pct, level };
}
function upcomingSpikes(days){
  const ts = iso(today()), te = iso(addDays(today(), days));
  return list().filter(s => !s.actual && s.date >= ts && s.date <= te).map(s => ({ s, sp: spikeOf(s) }))
    .filter(x => x.sp && x.sp.level !== "ok").sort((a, b) => byDate(a.s, b.s));
}

// Fitness aus dem Puls: Meter pro Herzschlag bei lockeren Läufen
function fitnessTrend(){
  const from = iso(addDays(today(), -7 * 16));
  const pts = list().filter(s => s.type === "easy" && s.actual && +s.actual.km >= 3 && s.actual.sec && s.actual.hr && s.date >= from)
    .sort(byDate).map(s => ({ date: s.date, v: (s.actual.km * 1000) / (s.actual.sec / 60) / s.actual.hr }));

    ${svg}<div class="legend" data-fit="1"><span><i class="sw" style="background:var(--t-easy);opacity:.6"></i>einzelner Lauf</span><span><i class="sw" style="background:var(--accent)"></i>Ø 4 Wochen</span></div>
    ${compact ? "" : `<p class="note fc-foot">Nur lockere Läufe mit Pulsangabe, ${F.pts.length} Werte aus 16 Wochen. Hitze, Wind und Hügel drücken den Wert, achte auf den Trend, nicht auf einzelne Läufe.${hrSet ? "" : " Tipp: Mit einer Puls-Obergrenze unter Wettkampf & Ziele prüft die App auch, ob die lockeren Läufe locker waren."}</p>`}`;
}

/* Rückmeldung nach dem Speichern */
let fbTimer = null;
function showFeedback(id){
  const s = state.sessions.get(id), fb = sessionFeedback(s); if (!fb) return;
  let el = $("fbCard");
  el.className = "fbcard fc-" + fb.level; el.hidden = false;
  el.innerHTML = `<span class="fc-dot"></span><div><div class="fc-t">${esc(s.title || TYPES[s.type]?.label || "Einheit")}</div><div class="fc-x">${esc(fb.text)}</div></div><button class="iconx" aria-label="Schließen">×</button>`;
  el.querySelector("button").onclick = () => { el.hidden = true; };
  clearTimeout(fbTimer); fbTimer = setTimeout(() => { el.hidden = true; }, 9000);
}

/* ---------- Dateien speichern und einlesen ---------- */
async function saveFile(blob, name){
  const file = new File([blob], name, { type: blob.type || "application/octet-stream" });
  // Auf dem Handy: Teilen-Menü (Dateien, AirDrop, Mail …), sonst normaler Download
  if (PHONE.matches && navigator.canShare && navigator.canShare({ files: [file] })){
    try { await navigator.share({ files: [file], title: name }); return true; }
    catch(e){ if (e && e.name === "AbortError") return false; }
  }
  const url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  return true;
}
async function exportJson(){
  const data = { format: "trainingsplan", version: 2, exported: new Date().toISOString(),
    settings: state.settings, sessions: list(), templates: state.templates };
  const ok = await saveFile(new Blob([JSON.stringify(data, null, 1)], { type: "application/json" }), `Trainingsplan-Sicherung_${iso(today())}.json`);
  if (ok) toast("Sicherung erstellt");
}
function pickImport(){ $("importFile").value = ""; $("importFile").click(); }
$("importFile").addEventListener("change", async e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!d || !Array.isArray(d.sessions)) throw new Error("format");
    let n = 0;
    d.sessions.forEach(s => { if (!s || !s.id || !s.date) return; const { id, ...body } = s; put("sessions", String(id), body, true); n++; });
    if (d.settings && typeof d.settings === "object") put("settings", "main", { ...state.settings, ...d.settings }, true);
    (d.templates || []).forEach(t => { if (t && t.id){ const { id, ...b } = t; put("templates", String(id), b, true); } });
    saveLocalDb(); applyDocs(); render(); scheduleSync(100);
    toast(`${n} Einheiten importiert`);
  } catch(err){ toast("Die Datei konnte nicht gelesen werden. Wähle eine Sicherung aus dieser App."); }
});

/* Offline-Unterstützung */
if ("serviceWorker" in navigator && location.protocol !== "file:"){
  navigator.serviceWorker.register("sw.js").then(reg => {
    reg.addEventListener("updatefound", () => {
      const w = reg.installing; if (!w) return;
      w.addEventListener("statechange", () => { if (w.state === "installed" && navigator.serviceWorker.controller) toast("Neue Version geladen. Sie ist beim nächsten Öffnen aktiv."); });
    });
  }).catch(() => {});
}

init();
})();

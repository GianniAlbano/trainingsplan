<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trainingsplan</title>
<meta name="theme-color" content="#252A30">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
@font-face{font-family:"Lato";font-weight:300;font-style:normal;font-display:swap;src:url(fonts/lato-300.woff2) format("woff2")}
@font-face{font-family:"Lato";font-weight:400;font-style:normal;font-display:swap;src:url(fonts/lato-400.woff2) format("woff2")}
@font-face{font-family:"Lato";font-weight:700;font-style:normal;font-display:swap;src:url(fonts/lato-700.woff2) format("woff2")}
@font-face{font-family:"Lato";font-weight:900;font-style:italic;font-display:swap;src:url(fonts/lato-900-italic.woff2) format("woff2")}
:root{color-scheme:light;box-sizing:border-box}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}
</style>
<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<style>
/* Layout: ruhige, dunkle Fläche; zentrierter Kopf mit dünnen Ringen, Abschnitte durch farbige Haarlinien getrennt, keine Kästen */
:root{
  --bg:#252A30; --surface:#2B3037; --sunken:#20242A; --line:#3A4048; --line-soft:#30353C;
  --ink:#ECEFF2; --muted:#8C949D; --accent:#4FC3D1; --accent-ink:#1E2226; --bib:#F4B840; --bib-ink:#1E2226;
  --violet:#7F88EE;
  --hero:#252A30; --hero-2:#252A30; --hero-fg:#ECEFF2; --hero-muted:#8C949D; --lane:transparent;
  --ok:#5FD0A2; --warn:#F28B74;
  --t-easy:#5FD0A2; --t-long:#7F88EE; --t-tempo:#F4B840; --t-interval:#F28B74;
  --t-recovery:#6EB9DE; --t-strength:#C18BEA; --t-boulder:#E8919F; --t-cross:#4FC3D1; --t-race:#ECEFF2; --t-rest:#5C646D;
  --f-display:"Lato","Helvetica Neue",Helvetica,Arial,sans-serif;
  --f-body:"Lato","Helvetica Neue",Helvetica,Arial,sans-serif;
  --f-mono:"Lato","Helvetica Neue",Helvetica,Arial,sans-serif;
  --r:10px; --shadow:none;
  color-scheme:dark;
}

/* Layouts: "Dunkel" ist der Standard (oben). "Hell" und "Morgenlauf" ersetzen nur die Tokens. */
:root[data-look="light"]{
  --bg:#F3F5F7; --surface:#FFFFFF; --sunken:#E9EDF0; --line:#D3D9DF; --line-soft:#E3E7EB;
  --ink:#1F2429; --muted:#68717A; --accent:#148A9A; --accent-ink:#FFFFFF; --bib:#D08C14; --bib-ink:#1F2429;
  --violet:#5F69D6;
  --hero:#F3F5F7; --hero-2:#F3F5F7; --hero-fg:#1F2429; --hero-muted:#68717A;
  --ok:#1E9A68; --warn:#D2553C;
  --t-easy:#22A273; --t-long:#5F69D6; --t-tempo:#D08C14; --t-interval:#E0644B;
  --t-recovery:#3A93C4; --t-strength:#9A5ECF; --t-boulder:#D0647A; --t-cross:#148A9A; --t-race:#1F2429; --t-rest:#A2AAB2;
  color-scheme:light;
}
:root[data-look="sunrise"]{
  --bg:#1B1840; --surface:#25214F; --sunken:#161334; --line:#3B3668; --line-soft:#2D2958;
  --ink:#FFF4EC; --muted:#AAA4CC; --accent:#FF9E7A; --accent-ink:#1B1840; --bib:#FFD166; --bib-ink:#1B1840;
  --violet:#9AA5FF;
  --hero:#1B1840; --hero-2:#1B1840; --hero-fg:#FFF4EC; --hero-muted:#AAA4CC;
  --ok:#7BE0B5; --warn:#FF8A7A;
  --t-easy:#7BE0B5; --t-long:#9AA5FF; --t-tempo:#FFD166; --t-interval:#FF8A7A;
  --t-recovery:#7CC8F0; --t-strength:#D9A2FF; --t-boulder:#FF9EC4; --t-cross:#6FE3E8; --t-race:#FFF4EC; --t-rest:#5E5890;
  color-scheme:dark;
}
:root[data-look="sunrise"] body{background:radial-gradient(140% 55% at 50% -14%, rgba(255,150,120,.38), rgba(180,90,170,.18) 45%, transparent 72%) fixed, var(--bg)}
:root[data-look="sunrise"] h1,
:root[data-look="sunrise"] .mtitle h2,
:root[data-look="sunrise"] .dlg h3,
:root[data-look="sunrise"] .dname,
:root[data-look="sunrise"] .dayhead h3,
:root[data-look="sunrise"] .period,
:root[data-look="sunrise"] .panel h2,
:root[data-look="sunrise"] .mslide h3{font-weight:900;font-style:italic;letter-spacing:.03em}
:root[data-look="sunrise"] .mtabs .mfab,
:root[data-look="sunrise"] .btn.primary{background:linear-gradient(135deg,#FFD166,#FF8A7A);border-color:transparent;color:#1B1840}
:root[data-look="sunrise"] .card{background:color-mix(in srgb,var(--surface) 55%,transparent);border-color:transparent}
:root[data-look="sunrise"] .mhead,
:root[data-look="sunrise"] .hero{border-image:linear-gradient(90deg,#FFD166,#FF8A7A,#9AA5FF) 1}
:root[data-look="sunrise"] .mtabs{background:color-mix(in srgb,var(--bg) 70%,transparent)}
:root[data-look="sunrise"] .mtabs .mfab{box-shadow:0 0 0 6px var(--bg),0 6px 22px rgba(255,140,110,.45)}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;font-weight:400;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:grid;gap:26px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:1px solid var(--accent);outline-offset:3px}
.num{font-variant-numeric:tabular-nums lining-nums}

/* ---------- Kopf ---------- */
.hero{color:var(--hero-fg);background:none;padding:6px 0 26px;border-bottom:2px solid var(--accent);
  display:grid;grid-template-columns:1fr auto auto 1fr;gap:22px 48px;align-items:center;justify-items:center}
.brand{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.bib{background:none;color:var(--bib);border:1px solid var(--bib);border-radius:20px;padding:2px 10px;font-weight:700;font-size:11px;letter-spacing:.14em;line-height:1.5;display:inline-flex;gap:4px;align-items:baseline}
.bib small{font-size:11px;font-weight:700;letter-spacing:.14em}
h1{font-family:var(--f-display);font-weight:300;font-size:clamp(30px,5vw,40px);line-height:1.05;margin:0;letter-spacing:.06em;text-transform:uppercase;text-wrap:balance}
.race{font-size:12px;color:var(--hero-muted);display:flex;gap:4px 14px;justify-content:center;align-items:center;flex-wrap:wrap;text-transform:uppercase;letter-spacing:.1em}
.race b{color:var(--hero-fg);font-weight:400}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-size:12px;text-transform:uppercase;letter-spacing:.1em;text-decoration:none;border-bottom:1px solid currentColor}
.count{grid-column:2;width:150px;height:150px;border-radius:50%;border:3px solid color-mix(in srgb,var(--bib) 75%,transparent);position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px;padding:14px}
.count .big{font-weight:300;font-size:46px;line-height:1;color:var(--ink)}
.count .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--bib);font-weight:700;line-height:1.35}
.count .btn{margin-top:4px;white-space:normal;padding:5px 10px;font-size:9.5px;line-height:1.3;text-align:center;justify-content:center}
.ringbox{grid-column:3;display:flex;align-items:center;gap:18px}
.ringbox svg{width:150px;height:150px;flex:none}
.ringbox .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);font-weight:700}
.ringbox .val{font-weight:300;font-size:30px;line-height:1.1}
.ringbox .val small{font-size:12px;color:var(--muted);font-weight:400;letter-spacing:.06em;text-transform:uppercase}
.ringbox .lbl + .val + .lbl{color:var(--muted)}
.hero .cta{grid-column:1/-1;display:flex;justify-content:center}

/* Knöpfe: dünn, Großbuchstaben */
.btn{border:1px solid var(--line);background:transparent;border-radius:30px;padding:8px 18px;font-weight:700;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;
  display:inline-flex;align-items:center;gap:8px;color:var(--ink);transition:border-color .15s,color .15s,background .15s}
.btn:hover{border-color:var(--muted)}
.btn svg{width:14px;height:14px;flex:none}
.btn.bibbtn{border-color:var(--accent);color:var(--accent)}
.btn.bibbtn:hover{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:var(--bib);color:var(--bib)}
.btn.primary{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,transparent)}
.btn.danger.armed{background:var(--warn);color:var(--accent-ink);border-color:var(--warn)}
.btn.sm{padding:6px 13px;font-size:10.5px}
.btn:disabled{opacity:.5}
@media (max-width:760px){
  .hero{grid-template-columns:1fr 1fr;gap:20px 12px}
  .count{grid-column:1;width:128px;height:128px}
  .count .big{font-size:38px}
  .ringbox{grid-column:2;flex-direction:column;gap:8px;text-align:center}
  .ringbox svg{width:128px;height:128px}
  .hero .cta .bibbtn{display:none}
}

/* ---------- Werkzeugleiste ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;gap:22px;background:none;padding:0}
.seg button{border:0;background:none;padding:6px 0;font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid transparent;border-radius:0}
.seg button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.nav .arrow{width:34px;height:34px;padding:0;justify-content:center;font-size:18px;font-weight:300;letter-spacing:0}
.period{font-weight:300;font-size:22px;letter-spacing:.08em;text-transform:uppercase;margin-left:8px}
.period small{text-transform:uppercase;font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--muted);margin-left:10px}
@media (max-width:640px){
  .seg{width:100%;justify-content:space-around}
  .nav{width:100%;justify-content:center} .period{order:-1;width:100%;margin:0;text-align:center}
  .toolbar .exp{width:100%;justify-content:center}
}

/* ---------- Kennzahlen ---------- */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;border-top:2px solid var(--bib);border-bottom:1px solid var(--line-soft);padding-block:18px}
.stat{background:none;padding:4px 16px;display:grid;gap:4px;align-content:start;text-align:center;border-left:1px solid var(--line-soft)}
.stat:first-child{border-left:0}
.stat .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--bib);font-weight:700;order:2}
.stat .v{font-weight:300;font-size:36px;line-height:1.1}
.stat .v small{font-size:11px;font-weight:400;color:var(--muted);margin-left:5px;letter-spacing:.06em;text-transform:uppercase}
.meter{height:2px;background:var(--line);border-radius:2px;overflow:hidden;margin:4px auto 0;width:70%;order:3}
.meter i{display:block;height:100%;background:var(--bib)}
@media (max-width:640px){
  .summary{grid-template-columns:1fr 1fr;row-gap:18px}
  .stat:nth-child(odd){border-left:0}
  .stat .v{font-size:30px}
}

.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:none;border:0;border-left:2px solid var(--bib);padding:4px 0 4px 14px;font-size:13px;color:var(--muted)}
.banner b{color:var(--ink);font-weight:700}
.note{font-size:12px;color:var(--muted);letter-spacing:.02em}

/* ---------- Woche ---------- */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:14px}
.day{background:none;border:0;border-top:1px solid var(--line);border-radius:0;padding:12px 0 0;display:flex;flex-direction:column;gap:10px;min-height:240px;min-width:0;transition:border-color .15s}
.day.today{border-top:2px solid var(--accent)}
.day.drop{border-top-color:var(--bib);background:color-mix(in srgb,var(--bib) 5%,transparent)}
.dhead{display:flex;justify-content:space-between;align-items:baseline;gap:6px;flex-wrap:wrap}
.dname{font-weight:300;font-size:22px;text-transform:uppercase;letter-spacing:.06em;line-height:1}
.today .dname{color:var(--accent)}
.ddate{font-size:11px;color:var(--muted);letter-spacing:.08em}
.todaytag{font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);background:none;padding:0}
.cards{display:flex;flex-direction:column;gap:10px;flex:1}
.card{text-align:left;width:100%;border:1px solid var(--line-soft);background:transparent;border-radius:var(--r);padding:0;display:grid;min-width:0;position:relative;transition:border-color .15s}
.card::before{content:"";position:absolute;left:-1px;top:12px;bottom:12px;width:2px;border-radius:2px;background:var(--tc)}
.card:hover{border-color:var(--line)}
.card[draggable="true"]{cursor:grab}
.card .open{all:unset;box-sizing:border-box;display:grid;gap:4px;padding:10px 40px 11px 12px;cursor:pointer;min-width:0;border-radius:var(--r)}
.card .open:focus-visible{outline:1px solid var(--accent);outline-offset:-1px}
.card .tt{display:flex;justify-content:space-between;gap:6px;align-items:center}
.chip{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--tc)}
.card .title{font-weight:400;font-size:14px;line-height:1.3;overflow-wrap:anywhere}
.kv{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:12px;color:var(--muted)}
.kv span{white-space:nowrap}
.kv .pace{color:var(--ink)}
.res{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:12px;color:var(--ok);font-weight:400;border-top:1px solid var(--line-soft);padding-top:6px;margin-top:3px}
.res span{white-space:nowrap}
.card.rest{border-style:dashed;background:none}
.card.rest .chip{color:var(--muted)}
.add{border:0;background:transparent;border-radius:0;padding:6px 0;font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.14em;text-transform:uppercase;text-align:left}
.add:hover{color:var(--accent)}
.weekfoot{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:14px}
.check{position:absolute;top:9px;right:9px;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);background:transparent;display:grid;place-items:center;padding:0;color:transparent;transition:border-color .15s,color .15s,background .15s}
.check svg{width:12px;height:12px}
.check:hover{border-color:var(--ok);color:var(--ok)}
.check.missed{border-color:var(--warn);color:var(--warn)}
.check.missed:hover{border-color:var(--ok);color:var(--ok)}
.check.done{border-color:var(--ok);color:var(--ok);background:transparent;cursor:default}
.zone{font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--tc);color:var(--tc);border-radius:10px;padding:0 6px;background:none;line-height:1.5}
@media (max-width:900px){
  .week{grid-template-columns:1fr;gap:0}
  .day{min-height:0;display:grid;grid-template-columns:58px minmax(0,1fr);align-items:start;gap:8px 14px;padding:14px 0}
  .dhead{flex-direction:column;align-items:flex-start;gap:3px}
  .cards{grid-column:2;grid-row:1/span 2}
  .day .add{grid-column:2;padding:2px 0}
  .cards:empty{display:none}
  .cards:empty + .add{grid-row:1}
}

/* ---------- Monat ---------- */
.month{background:none;border-top:2px solid var(--violet);overflow:hidden}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) minmax(58px,.8fr)}
.mh{font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:700;padding:12px 8px;border-bottom:1px solid var(--line-soft)}
.mh.sum{text-align:right;color:var(--violet)}
.mc{border:0;border-bottom:1px solid var(--line-soft);min-height:96px;padding:8px;display:flex;flex-direction:column;gap:5px;min-width:0;cursor:pointer;background:none;text-align:left;font:inherit;color:inherit;transition:background .15s}
.mc:hover{background:var(--surface)}
.mc.out{color:var(--muted);opacity:.45;background:none}
.mc.today .dn{color:var(--accent-ink);background:var(--accent);border-radius:10px;padding:0 7px}
.dn{font-size:13px;font-weight:300;align-self:flex-start}
.mpill{display:flex;align-items:center;gap:6px;font-size:11.5px;min-width:0;border-radius:0;padding:0;background:none;color:var(--muted)}
.mpill i{width:6px;height:6px;border-radius:50%;background:var(--tc);flex:none}
.mpill.done{color:var(--ink)}
.mpill.done i{box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--tc)}
.mpill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mpill.missed{opacity:.5;text-decoration:line-through}
.msum{border-bottom:1px solid var(--line-soft);padding:8px;text-align:right;display:flex;flex-direction:column;justify-content:center;gap:1px;font-size:10.5px;color:var(--muted);letter-spacing:.06em;background:none}
.msum b{font-weight:300;font-size:22px;color:var(--ink);letter-spacing:0}
@media (max-width:640px){
  .mc{min-height:56px;padding:5px 3px;gap:4px}
  .mpill span{display:none}
  .mpill i{width:8px;height:8px}
  .mh{padding:8px 3px;font-size:9.5px;letter-spacing:.06em}
  .msum{padding:4px} .msum b{font-size:16px}
}

/* ---------- Halbjahr ---------- */
.panel{background:none;border-radius:0;padding:16px 0 0;display:grid;gap:14px;min-width:0;border-top:2px solid var(--violet)}
.hgrid .panel:last-child{border-top-color:var(--accent)}
.panel h2{font-weight:300;text-transform:uppercase;font-size:20px;margin:0;letter-spacing:.1em}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-weight:700}
.legend span{display:inline-flex;align-items:center;gap:7px}
.sw{width:10px;height:10px;border-radius:50%;display:inline-block}
.chartbox{overflow-x:auto}
.chartbox svg{display:block;width:100%;min-width:560px;height:auto}
.hgrid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:32px}
@media (max-width:900px){.hgrid{grid-template-columns:1fr}}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:700;text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{padding:10px 8px;border-bottom:1px solid var(--line-soft);text-align:right;font-weight:300;font-variant-numeric:tabular-nums;white-space:nowrap}
td:first-child{font-weight:400}
tr:last-child td{border-bottom:0;font-weight:700;color:var(--ink)}
tr.cur td{color:var(--accent)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface)}
.typebars{display:grid;gap:14px}
.tb{display:grid;grid-template-columns:110px minmax(0,1fr) 40px;gap:12px;align-items:center;font-size:13px;font-weight:300}
.tb .bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.tb .bar i{display:block;height:100%;background:var(--tc);border-radius:2px}
.tb .n{text-align:right;color:var(--muted)}

/* ---------- Dialoge ---------- */
dialog{border:0;border-radius:14px;padding:0;background:var(--surface);color:var(--ink);width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px);box-shadow:0 30px 80px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(15,18,21,.72)}
.dlg{display:grid;gap:22px;padding:26px 24px}
.dlg h3{font-weight:300;text-transform:uppercase;font-size:26px;margin:0;line-height:1.1;letter-spacing:.08em;padding-bottom:14px;border-bottom:2px solid var(--accent)}
fieldset{border:0;padding:0;margin:0;display:grid;gap:14px}
legend{font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--bib);font-weight:700;padding:0;margin-bottom:12px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px}
label{display:grid;gap:4px;font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.12em;text-transform:uppercase;min-width:0}
input,select,textarea{background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:8px 0;color:var(--ink);width:100%;min-width:0;font-size:16px;font-weight:300;letter-spacing:0;text-transform:none}
select{background:var(--surface)}
select option{background:var(--surface);color:var(--ink)}
input:focus,select:focus,textarea:focus{border-bottom-color:var(--accent);outline:none;box-shadow:none}
textarea{resize:vertical;min-height:56px}
input[readonly]{color:var(--muted);background:transparent;border-bottom-style:dashed}
.hint{font-size:12px;color:var(--muted);font-weight:400;letter-spacing:.01em;text-transform:none}
.logbox{border-top:1px solid var(--line-soft);padding-top:18px;display:grid;gap:14px}
.toggle{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--ink);font-weight:700;letter-spacing:.14em}
.toggle input{width:20px;height:20px;accent-color:var(--ok);border:0;padding:0}
.pacebox{display:flex;align-items:baseline;gap:10px;background:none;border-radius:0;padding:4px 0;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.14em;font-weight:700}
.pacebox b{color:var(--ink);font-size:32px;font-weight:300;letter-spacing:0;text-transform:none}
.pacebox span{text-transform:none;letter-spacing:.02em;font-weight:400;font-size:12px}
.feel{display:flex;gap:8px;flex-wrap:wrap}
.feel button{border:1px solid var(--line);background:none;border-radius:30px;padding:6px 14px;font-size:12px;font-weight:400;letter-spacing:.04em}
.feel button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.rpe{display:flex;align-items:center;gap:12px}
.rpe input{padding:0;accent-color:var(--accent);border:0;background:none}
.rpe output{font-weight:300;font-size:26px;min-width:2ch;color:var(--ink);letter-spacing:0}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.actions .r{display:flex;gap:8px;margin-left:auto}
.err{color:var(--warn);font-size:13px}
@media (max-width:640px){
  dialog{width:100vw;max-width:100vw;max-height:94dvh;margin:auto 0 0;border-radius:16px 16px 0 0}
  .dlg{padding:22px max(16px,env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom,0px))}
}

/* ---------- Handy: feste Aktionsleiste ---------- */
.fab{display:none}
@media (max-width:640px){
  .fab{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:15;
    padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
    background:var(--bg);border-top:1px solid var(--line)}
  .fab .btn{width:100%;justify-content:center;padding:13px;font-size:12px}
  .wrap{padding-bottom:96px}
}

/* ---------- Schnellbewertung ---------- */
.quick{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:25;width:min(540px,calc(100vw - 24px));background:var(--surface);border:0;border-top:2px solid var(--ok);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.5);padding:16px 18px;display:grid;gap:10px}
.quick .qh{display:flex;align-items:center;gap:10px;justify-content:space-between}
.quick .qt{font-weight:400;display:flex;align-items:center;gap:10px;min-width:0}
.quick .qt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.quick .qt i{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ok);color:var(--ok);background:none;display:grid;place-items:center;font-style:normal;font-size:11px;flex:none}
.quick .qsub{font-size:12px;color:var(--muted)}
.quick .ql{font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--bib);font-weight:700}
.rpechips{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.rpechips button{border:1px solid var(--line);background:none;border-radius:50%;aspect-ratio:1;max-width:100%;padding:0;font-size:13px;font-weight:300}
.rpechips button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.quick .qa{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.iconx{border:0;background:none;color:var(--muted);font-size:22px;font-weight:300;line-height:1;padding:2px 6px}
@media (max-width:640px){ .quick{bottom:calc(76px + env(safe-area-inset-bottom,0px))} }

/* ---------- Vorlagen ---------- */
.tplbox{display:grid;gap:8px}
.tplbox > .note{font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--bib);font-weight:700}
.tpls{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.tpl{display:inline-flex;align-items:stretch;flex:none;border-radius:10px;background:none;border:1px solid var(--line);position:relative}
.tpl::before{content:"";position:absolute;left:10px;right:10px;top:-1px;height:2px;background:var(--tc);border-radius:2px}
.tpl button{border:0;background:none;text-align:left;padding:8px 4px 8px 12px;display:grid;gap:1px;font-weight:400;font-size:13px;white-space:nowrap}
.tpl button small{font-size:11px;color:var(--muted)}
.tpl .x{padding:0 10px;color:var(--muted);font-size:15px;display:flex;align-items:center}
.tpl .x.armed{background:var(--warn);color:var(--accent-ink);border-radius:0 9px 9px 0;font-size:11px;font-weight:700}
.zonetbl{display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;font-size:13px;font-weight:300;background:none;border-radius:0;padding:4px 0}
.zonetbl b{font-weight:300;text-align:right;font-variant-numeric:tabular-nums}
.zonetbl i{width:8px;height:8px;border-radius:50%;background:var(--tc);align-self:center}

/* ---------- Verschieben am Handy ---------- */
.card{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.card.lifted{opacity:.2;transform:scale(.96)}
.card.ghost{position:fixed;z-index:40;pointer-events:none;margin:0;background:var(--surface);border-color:var(--accent);box-shadow:0 18px 44px rgba(0,0,0,.55);transform:scale(1.03) rotate(-1.2deg)}
body.dragging{-webkit-user-select:none;user-select:none}
.day.drop{border-top-color:var(--accent)}
@media (max-width:900px){ .day.drop{background:color-mix(in srgb,var(--accent) 8%,transparent)} }
.touchhint{margin-right:auto;align-self:center}
@media (pointer:fine){ .touchhint{display:none} }

/* ---------- Schlanker Einheiten-Dialog ---------- */
.dlg.slim{gap:16px}
.shead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding-bottom:12px;border-bottom:2px solid var(--tc,var(--accent))}
.shead-t{display:grid;gap:3px;min-width:0}
.shead .chip{font-size:10px}
.dlg.slim h3{border:0;padding:0;font-size:24px;letter-spacing:.04em;overflow-wrap:anywhere}
.dlg h3:focus{outline:none}
.ssub{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.planview{display:grid;gap:8px;justify-items:start}
.planview .kv{font-size:14px;gap:4px 14px;color:var(--ink)}
.planview .kv .muted{color:var(--muted)}
.pvdesc{margin:0;font-size:14px;color:var(--muted);line-height:1.5}
.pvdesc:empty{display:none}
#planEdit .linkbtn{justify-self:start}
.logbox{gap:12px}
.logfields{display:grid;gap:12px}
.sublbl{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:-4px}
.dlg .rpechips button{aspect-ratio:auto;border-radius:8px;padding:7px 0}
.moredet summary{cursor:pointer;font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);list-style:none}
.moredet summary::-webkit-details-marker{display:none}
.moredet summary::before{content:"+ "}
.moredet[open] summary::before{content:"– "}
.moreinner{display:grid;gap:12px;margin-top:12px}
.linkbtn.danger{color:var(--warn)}
.linkbtn.armed{font-weight:700}
.nonrun .runonly{display:none!important}
/* Handy: Eintragen-Fenster passt ohne Scrollen auf den Bildschirm */
@media (max-width:640px){
  dialog{overscroll-behavior:contain}
  .dlg.slim{gap:12px;padding-top:18px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
  .dlg.slim h3{font-size:20px}
  .shead{padding-bottom:9px}
  .planview{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
  .planview .kv{font-size:13px}
  .planview .linkbtn{margin-left:auto;font-size:10.5px}
  .pvdesc{order:3;flex-basis:100%;font-size:13px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  .logging .pvdesc{display:none}
  .logbox{padding-top:12px;gap:10px}
  .logfields{gap:9px}
  .dlg.slim input,.dlg.slim select{padding:6px 0}
  .pacebox{padding:0;gap:8px}
  .pacebox b{font-size:20px}
  .dlg .rpechips button{padding:5px 0;font-size:12px}
  .feel{gap:6px}
  .feel button{padding:5px 11px}
  .sublbl{margin-bottom:-4px}
  .moreinner{margin-top:8px}
}
form:not(.isint) .intonly{display:none!important}
/* Wisch-Griff für Blätter */
.grab{display:none}
@media (max-width:640px){
  .grab{display:block;width:44px;height:5px;border-radius:3px;background:var(--line);margin:-12px auto -6px}
  dialog.sheet-back{transition:transform .22s ease-out}
}
/* Ziehen: kleiner Chip statt ganzer Karte, Zieltag leuchtet */
.dragchip{position:fixed;z-index:40;pointer-events:none;padding:5px 12px;border-radius:20px;background:var(--surface);border:1.5px solid var(--tc);color:var(--tc);font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.5);transform:translate(-50%,-100%)}
.wpill.drop{background:var(--bib)!important;border-color:var(--bib)!important;transform:scale(1.14);box-shadow:0 0 0 4px color-mix(in srgb,var(--bib) 30%,transparent),0 0 22px color-mix(in srgb,var(--bib) 55%,transparent)}
.wpill.drop .wd,.wpill.drop .wn{color:var(--bib-ink)!important}
.wpill.drop .dots i{border-color:var(--bib-ink)}
body.dragging .wpill:not(.drop){border-color:var(--line)}
/* Farbauswahl */
.colrow{display:grid;grid-template-columns:14px 1fr auto;align-items:center;gap:12px;padding:12px 0;border:0;border-bottom:1px solid var(--line-soft);width:100%;background:none;color:var(--ink);font-size:15px;text-align:left}
.colrow i{width:14px;height:14px;border-radius:50%;background:var(--tc)}
.colrow small{color:var(--muted);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;padding:6px 0 4px}
.palette button{aspect-ratio:1;border-radius:50%;border:2px solid transparent;background:var(--c);padding:0}
.palette button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 3px var(--surface)}
.backlink{justify-self:start}
.looks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.look{border:1.5px solid var(--line);background:none;border-radius:12px;padding:6px 6px 9px;display:grid;gap:7px;color:var(--ink)}
.look[aria-pressed="true"]{border-color:var(--accent)}
.lprev{height:76px;border-radius:8px;position:relative;display:block;overflow:hidden}
.lprev i{position:absolute;left:10px;top:12px;width:28px;height:28px;border-radius:50%;border:3px solid}
.lprev b{position:absolute;left:46px;height:5px;border-radius:3px}
.lprev b:nth-of-type(1){top:16px;width:38%}
.lprev b:nth-of-type(2){top:28px;width:24%}
.lprev u{position:absolute;left:10px;right:10px;bottom:12px;height:2px;border-radius:2px}
.lname{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.look[aria-pressed="true"] .lname{color:var(--accent)}
.msect{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--bib);margin:6px 0 -6px}

/* =====================================================================
   Handy-App: nur unter 640px; die Webansicht bleibt unberührt
   ===================================================================== */
.app{display:none}
@media (max-width:640px){
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  .wrap,.fab{display:none!important}
  /* Füllt immer den ganzen Bildschirm; Statusleiste oben und Home-Balken unten werden genau einmal freigehalten */
  .app{display:grid;grid-template-rows:auto minmax(0,1fr) auto;position:fixed;inset:0;
    padding-top:env(safe-area-inset-top,0px);
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .quick{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
.mhead{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;padding:10px 0 12px;border-bottom:2px solid var(--accent);gap:4px}
.mtop{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.mbrand{font-size:10px;font-weight:700;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;display:flex;gap:8px;align-items:center}
.mbrand .bib{font-size:9px;padding:1px 7px}
.mgear{width:36px;height:36px;border:0;background:none;color:var(--muted);display:grid;place-items:center;border-radius:50%;position:relative}
.mgear svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round}
.mgear .dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--bib)}
.mtitle{grid-column:2;text-align:center;min-width:0}
.mtitle h2{margin:0;font-weight:300;font-size:26px;letter-spacing:.08em;text-transform:uppercase;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtitle div{font-size:10.5px;font-weight:700;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-top:3px}
.marrow{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--ink);font-size:18px;font-weight:300;display:grid;place-items:center;padding:0}
.marrow:first-of-type{grid-column:1}
.mhead .marrow.r{grid-column:3}
.mbody{min-height:0;overflow:hidden;position:relative;display:flex;flex-direction:column;padding-block:14px 10px;gap:14px}
.mscroll{min-height:0;overflow-y:auto;scrollbar-width:none;flex:1;display:flex;flex-direction:column;gap:10px}
.mscroll::-webkit-scrollbar{display:none}
.mlbl{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--bib);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mlbl span{color:var(--muted);letter-spacing:.08em}
.mempty{border:1px dashed var(--line);border-radius:var(--r);padding:16px;text-align:center;color:var(--muted);font-size:13px;display:grid;gap:10px;justify-items:center}
.mlink{background:none;border:0;padding:0;color:var(--accent);font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}

/* Tab-Leiste */
.mtabs{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;border-top:1px solid var(--line);padding:8px 0 max(10px,env(safe-area-inset-bottom,0px))}
.mtabs button{border:0;background:none;color:var(--muted);display:grid;justify-items:center;gap:3px;padding:4px 0;font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.mtabs button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}
.mtabs button[aria-current="page"]{color:var(--accent)}
.mtabs .mfab{width:54px;height:54px;border-radius:50%;justify-self:center;align-self:center;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:-22px;box-shadow:0 0 0 6px var(--bg)}
.mtabs .mfab svg{width:24px;height:24px;stroke-width:2.2}

/* Heute */
.mrings{display:grid;grid-template-columns:1fr 1fr;gap:12px;justify-items:center;align-items:start}
.mrings .count{width:min(124px,34vw);height:min(124px,34vw);padding:10px}
.mrings .count .big{font-size:38px}
.mrings .count .lbl{font-size:9.5px}
.mring{display:grid;justify-items:center;gap:6px;text-align:center}
.mring svg{width:min(124px,34vw);height:min(124px,34vw)}
.mring .lbl{font-size:9.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);font-weight:700}
.mring .val{font-weight:300;font-size:15px}
.mring .val small{color:var(--muted);font-size:11px}
.mfit{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:8px;touch-action:pan-x}
.mfit .card .open{padding:9px 44px 10px 12px;gap:3px}
.mfit .card .title{font-size:15px}
.mfit .check{top:8px;right:8px}
.mnext{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.mmore{align-self:flex-start}
.mempty.compact{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;text-align:left}
.mrings .count,.mring svg{transition:width .2s,height .2s}
.mbody.tight{gap:10px;padding-top:10px}
.mbody.tight .mrings .count,.mbody.tight .mring svg{width:min(100px,27vw);height:min(100px,27vw)}
.mbody.tight .mrings .count .big{font-size:30px}
.mbody.tight .mrings .count .lbl{font-size:8.5px}
.mnotice{display:flex;justify-content:space-between;align-items:center;gap:10px;border-left:2px solid var(--warn);padding:4px 0 4px 12px;font-size:13px;color:var(--muted)}
.mnotice.ex{border-left-color:var(--bib)}

/* Woche */
.wstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wpill{border:1px solid transparent;background:none;border-radius:14px;padding:7px 0 8px;display:grid;justify-items:center;gap:3px;color:var(--muted);transition:border-color .15s,background .15s}
.wpill .wd{font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.wpill .wn{font-size:19px;font-weight:300;color:var(--ink);line-height:1.1}
.wpill .dots{display:flex;gap:3px;height:6px}
.wpill .dots i{width:5px;height:5px;border-radius:50%;border:1px solid var(--tc)}
.wpill .dots i.done{background:var(--tc)}
.wpill .dots i.missed{border-color:var(--warn)}
.wpill.today .wd{color:var(--accent)}
.wpill.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.wpill.drop{border-color:var(--bib);background:color-mix(in srgb,var(--bib) 14%,transparent);transform:scale(1.06)}
.wsum{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:baseline;font-size:12px;color:var(--muted)}
.wsum b{font-weight:300;font-size:20px;color:var(--ink)}
.wsum .meter{grid-column:1/-1;width:100%;margin:0}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line-soft);padding-top:12px}
.dayhead h3{margin:0;font-weight:300;font-size:22px;letter-spacing:.06em;text-transform:uppercase}
.dayhead h3 small{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--muted);margin-left:8px}
.mbody .card .open{padding:12px 46px 13px 14px}
.mbody .card .title{font-size:16px}
.mbody .check{width:30px;height:30px;top:10px;right:10px}
.mhint{font-size:11px;color:var(--muted);text-align:center}

/* Monat */
.mcal{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px}
.mcal .h{font-size:9.5px;font-weight:700;letter-spacing:.12em;color:var(--muted);text-align:center;padding-bottom:6px;text-transform:uppercase}
.mcal button{border:0;background:none;border-radius:12px;height:min(52px,7.2vh);display:grid;justify-items:center;align-content:center;gap:4px;color:var(--ink);padding:0}
.mcal button.out{opacity:.3}
.mcal button .n{font-size:15px;font-weight:300;line-height:1}
.mcal button.today .n{color:var(--accent-ink);background:var(--accent);border-radius:10px;padding:2px 6px}
.mcal button .dots{display:flex;gap:3px;height:6px}
.mcal button .dots i{width:5px;height:5px;border-radius:50%;border:1px solid var(--tc)}
.mcal button .dots i.done{background:var(--tc)}
.mcal button .dots i.missed{border-color:var(--warn);opacity:.7}
.mcal button:active{background:var(--surface)}
.mstats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 10px;border-top:2px solid var(--bib);padding-top:12px}
.mstats div{display:grid;gap:1px}
.mstats b{font-weight:300;font-size:26px;line-height:1.1}
.mstats b small{font-size:11px;color:var(--muted);margin-left:4px;font-weight:400}

<script>
(() => {
const TYPES = {
  easy:{label:"Lockerer Lauf"}, tempo:{label:"Tempolauf"},
  interval:{label:"Intervalle"}, strength:{label:"Kraft / Athletik"},
  boulder:{label:"Bouldern"}, cross:{label:"Alternativ"}, race:{label:"Wettkampf"}, rest:{label:"Ruhetag"}
};
// Einheiten ohne Laufstrecke: nur Dauer, Anstrengung, Gefühl und Notiz
const NONRUN = new Set(["strength","boulder","rest"]);
// Kommazahlen: "10,5" und "10.5" werden beide gelesen, angezeigt wird mit Komma
const kmv = id => { const v = parseFloat(String($(id).value).replace(",", ".")); return isFinite(v) ? v : 0; };
const decStr = n => (n === null || n === undefined || n === "") ? "" : String(n).replace(".", ",");
document.addEventListener("input", e => {
  const el = e.target; if (!el.matches || !el.matches("input[data-dec]")) return;
  let v = el.value.replace(/\./g, ",").replace(/[^\d,]/g, "");
  const i = v.indexOf(",");
  if (i >= 0) v = v.slice(0, i+1) + v.slice(i+1).replace(/,/g, "").slice(0, 2);
  if (v !== el.value) el.value = v;
}, true);
const fmtHMS = sec => { sec = Math.round(sec); return `${Math.floor(sec/3600)}:${pad(Math.floor(sec%3600/60))}:${pad(sec%60)}`; };
const fmtHM = sec => { const m = Math.round(sec/60); return `${Math.floor(m/60)}:${pad(m%60)}`; };
const fmtMin = sec => sec >= 3600 ? fmtTime(sec).replace(/:\d\d$/,"") + " h" : Math.round(sec/60) + " min";
const FEELS = ["Schwer","Zäh","Okay","Gut","Super"];
const WD = ["Mo","Di","Mi","Do","Fr","Sa","So"];
const WD_L = ["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];
const MONTHS = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const sow = d => { const x = new Date(d.getFullYear(),d.getMonth(),d.getDate()); return addDays(x,-((x.getDay()+6)%7)); };
const isoWeek = d => { const t = new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const day = t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-day); const y0 = new Date(Date.UTC(t.getUTCFullYear(),0,1)); return Math.ceil(((t-y0)/864e5+1)/7); };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtKm = n => (Math.round((n||0)*10)/10).toLocaleString("de-DE",{maximumFractionDigits:1});
const fmtDM = d => `${pad(d.getDate())}.${pad(d.getMonth()+1)}.`;
const parseTime = s => { if(!s) return 0; s = String(s).trim().replace(",",".");
  const p = s.split(":").map(Number); if (p.some(isNaN)) return 0;
  if (p.length===3) return p[0]*3600+p[1]*60+p[2]; if (p.length===2) return p[0]*60+p[1]; return p[0]*60; };
const fmtTime = sec => { if(!sec) return ""; sec = Math.round(sec); const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60;
  return h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`; };
const fmtPaceSec = p => { if(!p || !isFinite(p)) return ""; p = Math.round(p); return `${Math.floor(p/60)}:${pad(p%60)}`; };
const fmtPace = (sec,km) => (sec && km) ? fmtPaceSec(sec/km) + " /km" : "–";
const today = () => { const n = new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate()); };
// Pace-Zonen relativ zum Marathontempo (Sekunden pro km Abstand, Spanne ±)
const ZONES = {
  recovery:{label:"Regeneration", short:"REG", off:85, span:10, tc:"recovery"},
  easy:{label:"Dauerlauf", short:"DL", off:60, span:12, tc:"easy"},
  long:{label:"Langer Lauf", short:"LL", off:40, span:12, tc:"long"},
  mp:{label:"Marathontempo", short:"MRT", off:0, span:5, tc:"race"},
  tempo:{label:"Schwelle", short:"SCHW", off:-18, span:5, tc:"tempo"},
  interval:{label:"Intervalle", short:"INT", off:-35, span:6, tc:"interval"}
};
const TYPE_ZONE = {easy:"easy", long:"long", tempo:"tempo", interval:"interval", recovery:"recovery", race:"mp"};
const goalSec = goal => { const p = String(goal||"").trim().split(":").map(Number);
  if (p.length===2 && p[0] < 10 && !p.some(isNaN)) return p[0]*3600 + p[1]*60; // "3:45" = 3 h 45 min
  return parseTime(goal); };
const mpSec = (goal = state.settings?.goal) => { const g = goalSec(goal); return g >= 6000 && g <= 32400 ? g/42.195 : 0; };
const zonePace = (z, goal) => { const mp = mpSec(goal); return mp && ZONES[z] ? mp + ZONES[z].off : 0; };
// geplante Pace: Zone (aus Zielzeit), gespeichert oder aus Distanz und Dauer abgeleitet
const planPace = s => (s.planZone && zonePace(s.planZone)) || s.planPace || (s.planKm && s.planMin ? s.planMin*60/s.planKm : 0);
const planMinutes = s => (s.planZone && zonePace(s.planZone) && s.planKm) ? Math.round(s.planKm*zonePace(s.planZone)/60) : (s.planMin || null);

const state = { sessions:new Map(), templates:[], settings:{}, view:"week", anchor:today(), mode:"loading" };
const PHONE = matchMedia("(max-width:640px)");
const M = { tab:"today", day:today(), month:new Date(today().getFullYear(), today().getMonth(), 1), half:today(), slide:0 };

/* ---------- Speicher: zuerst auf dem Gerät, dann Abgleich mit Supabase ---------- */
const CFG = window.TP_CONFIG || {};
const HAS_CLOUD = !!(CFG.supabaseUrl && CFG.supabaseKey && window.supabase && window.supabase.createClient);
let sb = null;
const auth = { user:null };
const sync = { status: HAS_CLOUD ? "loading" : "local", at:null };
const LOCAL_KEY = uid => "tp.v2." + (uid || "local");
const LAST_USER = "tp.lastUser";
let local = { docs:{}, outbox:{}, lastSync:null };
const emptyLocal = () => ({ docs:{}, outbox:{}, lastSync:null });

function loadLocalDb(uid){
  try { local = JSON.parse(localStorage.getItem(LOCAL_KEY(uid))) || emptyLocal(); } catch(e){ local = emptyLocal(); }
  local.docs = local.docs || {}; local.outbox = local.outbox || {};
  applyDocs();
}
function saveLocalDb(){
  try { localStorage.setItem(LOCAL_KEY(auth.user && auth.user.id), JSON.stringify(local)); }
  catch(e){ toast("Der Speicher auf diesem Gerät ist voll. Exportiere deine Daten in den Einstellungen."); }
}
function applyDocs(){
  const sessions = new Map(), templates = []; let settings = {};
  for (const [k, v] of Object.entries(local.docs)){
    const i = k.indexOf("/"), col = k.slice(0, i), id = k.slice(i+1);
    if (col === "sessions") sessions.set(id, {...v, id});
    else if (col === "settings" && id === "main") settings = v;
    else if (col === "templates") templates.push({...v, id});
  }
  state.sessions = sessions; state.templates = templates; state.settings = settings;
}
// Eine Änderung: sofort lokal speichern, anzeigen und zum Abgleich vormerken
function put(col, id, data, quiet){
  const k = col + "/" + id;
  if (data === null) delete local.docs[k]; else local.docs[k] = data;
  local.outbox[k] = { col, id, data, t: Date.now() };
  if (quiet) return;
  saveLocalDb(); applyDocs(); render(); scheduleSync();
}
const store = {
  async save(id, body){ put("sessions", id, body); },
  async remove(id){ put("sessions", id, null); },
  async saveSettings(body){ put("settings", "main", body); },
  async saveTpl(id, body){ put("templates", id, body); },
  async removeTpl(id){ put("templates", id, null); }
};
const newId = () => "s" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);

/* Abgleich */
let syncTimer = null, syncing = false;
function setSync(s){ sync.status = s; if (s === "ok") sync.at = new Date(); renderSyncBadge(); }
function scheduleSync(ms){ if (!sb) return; clearTimeout(syncTimer); syncTimer = setTimeout(syncNow, ms ?? 700); }
async function syncNow(){
  if (!sb || !auth.user || syncing) return;
  if (!navigator.onLine){ setSync("offline"); return; }
  syncing = true; setSync("syncing");
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (!session){ syncing = false; setSync("signedout"); showLogin("Bitte melde dich erneut an, damit deine Daten abgeglichen werden."); return; }
    // 1. Eigene Änderungen hochladen
    const pending = Object.entries(local.outbox);
    for (let i = 0; i < pending.length; i += 200){
      const part = pending.slice(i, i + 200);
      const rows = part.map(([k, o]) => ({ user_id: auth.user.id, collection: o.col, id: o.id, data: o.data, deleted: o.data === null }));
      const { error } = await sb.from("docs").upsert(rows, { onConflict: "user_id,collection,id" });
      if (error) throw error;
      part.forEach(([k, o]) => { if (local.outbox[k] && local.outbox[k].t === o.t) delete local.outbox[k]; });
      saveLocalDb();
    }
    // 2. Änderungen von anderen Geräten holen
    for (;;){
      let q = sb.from("docs").select("collection,id,data,deleted,updated_at").order("updated_at", { ascending: true }).limit(1000);
      if (local.lastSync) q = q.gt("updated_at", local.lastSync);
      const { data, error } = await q;
      if (error) throw error;
      data.forEach(r => {
        const k = r.collection + "/" + r.id;
        if (!local.outbox[k]){ if (r.deleted || r.data === null) delete local.docs[k]; else local.docs[k] = r.data; }
        local.lastSync = r.updated_at;
      });
      if (data.length < 1000) break;
    }
    saveLocalDb(); applyDocs(); setSync("ok"); render();
  } catch(e){
    console.warn("Abgleich fehlgeschlagen", e);
    setSync(navigator.onLine ? "error" : "offline");
  } finally {
    syncing = false;
    if (Object.keys(local.outbox).length && sync.status === "ok") scheduleSync(1500);
  }
}

/* Anmeldung */
function readLastUser(){ try { return JSON.parse(localStorage.getItem(LAST_USER)); } catch(e){ return null; } }
function setUser(u){
  const changed = !auth.user || auth.user.id !== u.id;
  auth.user = { id: u.id, email: u.email };
  try { localStorage.setItem(LAST_USER, JSON.stringify(auth.user)); } catch(e){}
  hideLogin();
  if (changed) loadLocalDb(u.id);
  render(); scheduleSync(50);
}
async function init(){
  if (!HAS_CLOUD){ loadLocalDb(null); setSync("local"); render(); return; }
  sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storageKey: "tp-auth" } });
  const last = readLastUser();
  // Sofort mit den Daten auf dem Gerät starten, auch offline
  if (last){ auth.user = last; loadLocalDb(last.id); render(); }
  let session = null, failed = false;
  try { const r = await sb.auth.getSession(); session = r.data.session; failed = !!r.error; } catch(e){ failed = true; }
  if (session && session.user) setUser(session.user);
  else if (last && (!navigator.onLine || failed)) setSync("offline");
  else showLogin();
  sb.auth.onAuthStateChange((ev, s) => {
    if (ev === "PASSWORD_RECOVERY"){ showLogin(null, "recover"); return; }
    if (s && s.user && ev !== "SIGNED_OUT") setUser(s.user);
  });
  window.addEventListener("online", () => scheduleSync(200));
  window.addEventListener("offline", () => setSync("offline"));
  document.addEventListener("visibilitychange", () => { if (!document.hidden) scheduleSync(200); });
  setInterval(() => { if (!document.hidden) scheduleSync(0); }, 120000);
}
async function signOut(){
  try { if (sb) await sb.auth.signOut(); } catch(e){}
  try { localStorage.removeItem(LOCAL_KEY(auth.user && auth.user.id)); localStorage.removeItem(LAST_USER); } catch(e){}
  auth.user = null; local = emptyLocal(); applyDocs(); render(); showLogin();
}

/* Anmeldemaske */
let loginMode = "signin", lastMail = "";
function showLogin(msg, mode){
  if (!HAS_CLOUD) return;
  if (mode) loginMode = mode;
  const box = $("login"); box.hidden = false; document.body.classList.add("locked");
  const t = { signin:["Anmelden","Noch kein Konto? Registrieren"], signup:["Konto erstellen","Schon registriert? Anmelden"], recover:["Neues Passwort speichern",""] }[loginMode];
  $("loginForm").innerHTML = `
    <div class="lmark">42.2</div>
    <h2>${loginMode==="recover" ? "Neues Passwort" : "Trainingsplan"}</h2>
    <p class="note" id="loginMsg" ${msg ? "" : "hidden"}>${esc(msg||"")}</p>
    ${loginMode==="recover" ? "" : `<label>E-Mail<input type="email" id="l_mail" autocomplete="username" required value="${esc(lastMail || (readLastUser()||{}).email || "")}"></label>`}
    <label>${loginMode==="recover" ? "Neues Passwort" : "Passwort"}<input type="password" id="l_pw" autocomplete="${loginMode==="signin" ? "current-password" : "new-password"}" minlength="8" required></label>
    <div class="err" id="loginErr" hidden></div>
    <button type="submit" class="btn primary" id="l_go">${t[0]}</button>
    ${t[1] ? `<button type="button" class="linkbtn" id="l_switch">${t[1]}</button>` : ""}
    ${loginMode==="signin" ? `<button type="button" class="linkbtn" id="l_forgot">Passwort vergessen?</button>` : ""}`;
  if ($("l_switch")) $("l_switch").onclick = () => { loginMode = loginMode==="signin" ? "signup" : "signin"; showLogin(); };
  if ($("l_forgot")) $("l_forgot").onclick = async () => {
    const mail = $("l_mail").value.trim(); if (!mail){ loginErr("Gib zuerst deine E-Mail-Adresse ein."); return; }
    const { error } = await sb.auth.resetPasswordForEmail(mail, { redirectTo: location.origin + location.pathname });
    if (error) loginErr(authText(error)); else loginNote("Wir haben dir einen Link zum Zurücksetzen geschickt. Öffne ihn auf diesem Gerät.");
  };
}
function hideLogin(){ const box = $("login"); if (box){ box.hidden = true; document.body.classList.remove("locked"); } }
function loginErr(m){ $("loginErr").textContent = m; $("loginErr").hidden = false; }
function loginNote(m){ $("loginMsg").textContent = m; $("loginMsg").hidden = false; $("loginErr").hidden = true; }
function authText(e){
  const m = (e && e.message || "").toLowerCase();
  if (m.includes("invalid login")) return "E-Mail oder Passwort stimmt nicht.";
  if (m.includes("email not confirmed")) return "Bitte bestätige zuerst deine E-Mail-Adresse über den Link in der Mail.";
  if (m.includes("already registered")) return "Für diese E-Mail gibt es schon ein Konto. Melde dich an.";
  if (m.includes("password")) return "Das Passwort muss mindestens 8 Zeichen haben.";
  if (m.includes("signups not allowed") || m.includes("signup is disabled")) return "Neue Konten sind für diese App abgeschaltet.";
  if (!navigator.onLine || m.includes("fetch")) return "Keine Verbindung. Für die Anmeldung brauchst du Internet.";
  return "Das hat nicht geklappt: " + (e && e.message || "unbekannter Fehler");
}
document.addEventListener("submit", async e => {
  if (e.target.id !== "loginForm") return;
  e.preventDefault();
  const pw = $("l_pw").value, mail = $("l_mail") ? $("l_mail").value.trim() : "";
  if (mail) lastMail = mail;
  $("l_go").disabled = true; $("loginErr").hidden = true;
  try {
    if (loginMode === "recover"){
      const { error } = await sb.auth.updateUser({ password: pw }); if (error) throw error;
      loginMode = "signin"; toast("Passwort geändert"); hideLogin(); return;
    }
    if (loginMode === "signup"){
      const { data, error } = await sb.auth.signUp({ email: mail, password: pw, options: { emailRedirectTo: location.origin + location.pathname } });
      if (error) throw error;
      if (!data.session){ loginMode = "signin"; showLogin("Fast geschafft: Bestätige deine E-Mail über den Link, den du bekommen hast. Danach meldest du dich hier an."); return; }
      setUser(data.user); return;
    }
    const { data, error } = await sb.auth.signInWithPassword({ email: mail, password: pw });
    if (error) throw error;
    setUser(data.user);
  } catch(err){ loginErr(authText(err)); }
  finally { if ($("l_go")) $("l_go").disabled = false; }
});

/* Anzeige des Abgleichs */
function syncText(){
  if (sync.status === "local") return "Ohne Konto: Daten liegen nur in diesem Browser. Trage deine Supabase-Daten in config.js ein, um sie abzugleichen.";
  if (sync.status === "offline") return "Offline. Änderungen werden auf dem Gerät gespeichert und abgeglichen, sobald du wieder online bist.";
  if (sync.status === "error") return "Abgleich hat nicht geklappt. Deine Änderungen sind auf dem Gerät gespeichert, der nächste Versuch läuft automatisch.";
  if (sync.status === "signedout") return "Abgemeldet. Melde dich an, damit deine Daten abgeglichen werden.";
  if (sync.status === "syncing") return "Wird abgeglichen …";
  if (sync.status === "ok") return "Abgeglichen " + sync.at.toLocaleTimeString("de-DE", { hour:"2-digit", minute:"2-digit" }) + (Object.keys(local.outbox).length ? " · Änderungen warten" : "");
  return "";
}
function renderSyncBadge(){
  const n = $("storeNote"); if (n) n.textContent = syncText();
  const d = document.querySelector(".mgear .sync");
  if (d) d.dataset.s = sync.status;
}

/* ---------- Ableitungen ---------- */
const list = () => [...state.sessions.values()];
const inRange = (a,b) => list().filter(s => s.date >= a && s.date <= b);
function status(s){
  if (s.actual) return "done";
  if (s.type === "rest") return "rest";
  return s.date < iso(today()) ? "missed" : "planned";
}
function totals(arr){
  let planKm=0, doneKm=0, planCount=0, doneCount=0, sec=0, runSec=0, runKm=0, rpeSum=0, rpeN=0, longest=0;
  arr.forEach(s => {
    if (s.type==="rest") return;
    planKm += +s.planKm||0; planCount++;
    if (s.actual){ doneCount++; doneKm += +s.actual.km||0; sec += +s.actual.sec||0;
      if (s.actual.km && s.actual.sec){ runKm += +s.actual.km; runSec += +s.actual.sec; }
      if (s.actual.rpe){ rpeSum += +s.actual.rpe; rpeN++; }
      longest = Math.max(longest, +s.actual.km||0); }
  });
  return {planKm, doneKm, planCount, doneCount, sec, rpe: rpeN ? rpeSum/rpeN : 0, longest, avgPace: runKm ? runSec/runKm : 0};
}
const byDate = (a,b) => a.date.localeCompare(b.date) || (a.created||0)-(b.created||0);

/* ---------- Rendering ---------- */
function render(){
  applyColors();
  if (PHONE.matches){ renderMobile(); if (quickId) renderQuick(); return; }
  renderHero(); renderBanner();
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.view===state.view)));
  if (state.view==="week") renderWeek(); else if (state.view==="month") renderMonth(); else renderHalf();
  if (quickId) renderQuick();
  renderSyncBadge();
}

function renderHero(){
  const st = state.settings||{};
  if (st.raceDate){
    const days = Math.round((parse(st.raceDate) - today())/864e5);
    $("race").innerHTML = `<b>${esc(st.raceName||"Wettkampf")}</b><span>${parse(st.raceDate).toLocaleDateString("de-DE",{day:"numeric",month:"long",year:"numeric"})}</span>${st.goal?`<span>Ziel <b class="num">${esc(st.goal)}</b></span>`:""}${mpSec()?`<span>MRT <b class="num">${fmtPaceSec(mpSec())} /km</b></span>`:""}<button class="linkbtn" id="raceEdit">ändern</button>`;
    $("count").innerHTML = days > 0
      ? `<span class="big num">${days}</span><span class="lbl">Tage bis zum Start · ${Math.floor(days/7)} Wochen</span>`
      : days === 0 ? `<span class="big">Heute</span><span class="lbl">Renntag – viel Erfolg</span>`
      : `<span class="big num">${-days}</span><span class="lbl">Tage seit dem Rennen</span>`;
  } else {
    $("race").innerHTML = `Noch kein Rennen festgelegt. <button class="linkbtn" id="raceEdit">Wettkampf festlegen</button>`;
    $("count").innerHTML = `<span class="lbl">Countdown</span><button class="btn ghost sm" id="raceEdit2">Renndatum eintragen</button>`;
  }
  $("raceEdit").onclick = openRace; if ($("raceEdit2")) $("raceEdit2").onclick = openRace;
  // Ring: diese Woche
  const s = sow(today()), t = totals(inRange(iso(s), iso(addDays(s,6))));
  const pct = t.planKm ? Math.min(1, t.doneKm/t.planKm) : 0, C = 2*Math.PI*38;
  $("ring").innerHTML = `<svg viewBox="0 0 84 84" aria-hidden="true"><circle cx="42" cy="42" r="38" fill="none" stroke="var(--line)" stroke-width="2.4"/>
    <circle cx="42" cy="42" r="38" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="${(C*pct).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 42 42)"/>
    <text x="42" y="48" text-anchor="middle" font-size="19" font-weight="300" fill="var(--hero-fg)" font-family="Lato, Helvetica, sans-serif">${Math.round(pct*100)}%</text></svg>
    <div><div class="lbl">Diese Woche</div><div class="val num">${fmtKm(t.doneKm)}<small> / ${fmtKm(t.planKm)} km</small></div><div class="lbl" style="letter-spacing:.04em;text-transform:none;margin-top:2px">${t.doneCount} von ${t.planCount} Einheiten</div></div>`;
}

let bannerArmed = false;
function renderBanner(){
  const ex = list().filter(s => s.example);
  if (!ex.length){ $("bannerSlot").innerHTML = ""; return; }
  $("bannerSlot").innerHTML = `<div class="banner"><span><b>Beispielplan:</b> ${ex.length} Einheiten zum Ausprobieren. Bearbeite sie oder lösche sie und trage deinen eigenen Plan ein.</span>
    <button class="btn sm danger ${bannerArmed?"armed":""}" id="clearEx">${bannerArmed?"Wirklich alle Beispiele löschen?":"Beispiele löschen"}</button></div>`;
  $("clearEx").onclick = async () => {
    if (!bannerArmed){ bannerArmed = true; renderBanner(); setTimeout(()=>{bannerArmed=false;renderBanner();},4000); return; }
    bannerArmed = false;
    await clearExamples();
  };
}
async function clearExamples(){
  for (const s of list().filter(s => s.example)) { try{ await store.remove(s.id); }catch(e){} }
  toast("Beispiele gelöscht");
}

function statsHtml(t, extra=""){
  const pct = t.planKm ? Math.min(100, t.doneKm/t.planKm*100) : 0;
  return `
  <div class="stat"><span class="k">Gelaufen</span><span class="v num">${fmtKm(t.doneKm)}<small>/ ${fmtKm(t.planKm)} km</small></span><div class="meter"><i style="width:${pct}%"></i></div></div>
  <div class="stat"><span class="k">Einheiten</span><span class="v num">${t.doneCount}<small>/ ${t.planCount}</small></span></div>
  <div class="stat"><span class="k">Ø Pace</span><span class="v num">${t.avgPace?fmtPaceSec(t.avgPace):"–"}<small>/km</small></span></div>
  <div class="stat"><span class="k">Trainingszeit</span><span class="v num">${t.sec?fmtTime(t.sec).replace(/:\d\d$/,""):"0:00"}<small>h:mm</small></span></div>
  <div class="stat"><span class="k">Ø Anstrengung</span><span class="v num">${t.rpe?t.rpe.toLocaleString("de-DE",{maximumFractionDigits:1}):"–"}<small>RPE</small></span></div>${extra}`;
}

const CHECK_SVG = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-7"/></svg>`;
function cardHtml(s){
  const st = status(s), tc = `var(--t-${s.type||"easy"})`;
  const pp = planPace(s), pm = planMinutes(s), zoned = s.planZone && zonePace(s.planZone);
  const plan = [s.planKm?`<span>${fmtKm(s.planKm)} km</span>`:"", pm?`<span>${zoned?"~":""}${pm} min</span>`:"",
    pp && !NONRUN.has(s.type)?`<span class="pace">${fmtPaceSec(pp)} /km</span>`:"",
    zoned?`<span class="zone" style="--tc:var(--t-${ZONES[s.planZone].tc})">${ZONES[s.planZone].short}</span>`:""].join("");
  const a = s.actual;
  const res = a ? [a.km?`<span>${fmtKm(a.km)} km</span>`:"", a.sec?`<span>${NONRUN.has(s.type) ? fmtMin(a.sec) : fmtTime(a.sec)}</span>`:"", a.km&&a.sec?`<span>${fmtPace(a.sec,a.km)}</span>`:"", a.hr?`<span>♥ ${a.hr}</span>`:"", a.feel?`<span>${FEELS[a.feel-1]}</span>`:""].join("") : "";
  const check = st==="rest" ? "" : st==="done"
    ? `<span class="check done" title="Absolviert" aria-label="Absolviert">${CHECK_SVG}</span>`
    : `<button class="check ${st==="missed"?"missed":""}" data-check="${esc(s.id)}" title="Wie geplant erledigt" aria-label="${esc(TYPES[s.type]?.label)} wie geplant erledigt">${CHECK_SVG}</button>`;
  return `<div class="card ${s.type==="rest"?"rest":""}" style="--tc:${tc}" data-id="${esc(s.id)}"${FINE ? ' draggable="true"' : ""}>
    <button class="open" data-open="${esc(s.id)}">
      <span class="tt"><span class="chip">${esc(TYPES[s.type]?.label||"Training")}</span></span>
      ${s.title?`<span class="title">${esc(s.title)}</span>`:""}
      ${plan?`<span class="kv num">${plan}</span>`:""}
      ${res?`<span class="res num">${res}</span>`:""}
    </button>${check}
  </div>`;
}

function renderWeek(){
  const start = sow(state.anchor), end = addDays(start,6);
  $("period").innerHTML = `KW ${isoWeek(start)}<small>${fmtDM(start)} – ${fmtDM(end)}${end.getFullYear()}</small>`;
  const arr = inRange(iso(start), iso(end));
  $("summary").innerHTML = statsHtml(totals(arr));
  const t = iso(today()), narrow = matchMedia("(max-width:900px)").matches;
  let html = `<div class="week">`;
  for (let i=0;i<7;i++){
    const d = addDays(start,i), ds = iso(d);
    const items = arr.filter(s => s.date===ds).sort(byDate);
    html += `<div class="day ${ds===t?"today":""}" data-date="${ds}">
      <div class="dhead"><span class="dname">${WD[i]}</span><span class="ddate num">${fmtDM(d)}</span>${ds===t?`<span class="todaytag">Heute</span>`:""}</div>
      <div class="cards">${items.map(cardHtml).join("")}</div>
      <button class="add" data-add="${ds}">+ Einheit</button></div>`;
  }
  html += `</div><div class="weekfoot"><span class="note touchhint">Einheit gedrückt halten und auf einen anderen Tag ziehen, um sie zu verschieben.</span><button class="btn sm" id="copyWeek">Woche in nächste Woche kopieren</button></div>`;
  $("view").innerHTML = html;
  bindCards();
  document.querySelectorAll("[data-add]").forEach(b => b.onclick = () => openSession(null, b.dataset.add));
  $("copyWeek").onclick = copyWeek;
  document.querySelectorAll(".day").forEach(day => {
    day.ondragover = e => { e.preventDefault(); day.classList.add("drop"); };
    day.ondragleave = () => day.classList.remove("drop");
    day.ondrop = e => {
      e.preventDefault(); day.classList.remove("drop");
      moveSession(e.dataTransfer.getData("text/plain"), day.dataset.date);
    };
  });
  document.querySelectorAll(".card").forEach(c => c.ondragstart = e => e.dataTransfer.setData("text/plain", c.dataset.id));
}
async function moveSession(id, date){
  const s = state.sessions.get(id);
  if (!s || !date || s.date===date) return;
  const {id:_, ...body} = s; body.date = date; body.example = false;
  try { await store.save(id, body); toast(`Verschoben auf ${WD_L[(parse(date).getDay()+6)%7]}, ${fmtDM(parse(date))}`); } catch(err){ toast("Verschieben hat nicht geklappt"); }
}

/* ---------- Handy: gedrückt halten und ziehen ---------- */
const FINE = matchMedia("(pointer:fine)").matches;
let td = null, suppressClick = 0;
document.addEventListener("touchstart", e => {
  if (e.touches.length>1) return;
  const card = e.target.closest(".card[data-id]");
  if (!card || e.target.closest(".check")) return;
  const inDesk = card.closest("#view") && state.view==="week" && !PHONE.matches;
  const inPhone = card.closest("#mWeekDay") && PHONE.matches;
  if (!inDesk && !inPhone) return;
  const t = e.touches[0];
  td = {id:card.dataset.id, card, x0:t.clientX, y0:t.clientY, lx:t.clientX, ly:t.clientY, active:false};
  td.timer = setTimeout(startTouchDrag, 380);
}, {passive:true});
function startTouchDrag(){
  if (!td) return; td.active = true;
  const s0 = state.sessions.get(td.id);
  const g = document.createElement("div"); g.className = "dragchip";
  g.style.setProperty("--tc", `var(--t-${s0?.type || "easy"})`);
  g.textContent = s0?.title || TYPES[s0?.type]?.label || "Einheit";
  document.body.appendChild(g); td.ghost = g;
  td.card.classList.add("lifted"); document.body.classList.add("dragging");
  try { navigator.vibrate && navigator.vibrate(12); } catch(e){}
  moveTouchDrag(); autoScroll();
}
function moveTouchDrag(){
  const {lx:x, ly:y} = td;
  // Chip schwebt deutlich über dem Finger, damit der Zieltag sichtbar bleibt
  const hw = td.ghost.offsetWidth/2 + 8, vw = document.documentElement.clientWidth;
  td.ghost.style.left = Math.min(Math.max(x, hw), vw - hw) + "px"; td.ghost.style.top = Math.max(y - 46, 40) + "px";
  const el = document.elementFromPoint(x, y), day = el && el.closest(".day, .wpill");
  if (td.over && td.over !== day) td.over.classList.remove("drop");
  if (day && td.over !== day){ day.classList.add("drop"); try { navigator.vibrate && navigator.vibrate(6); } catch(e){} }
  td.over = day;
}
function autoScroll(){
  if (!td || !td.active) return;
  const H = window.innerHeight, top = 80, bottom = H - 140, y = td.ly;
  const v = y < top ? -(top - y)/5 : y > bottom ? (y - bottom)/5 : 0;
  if (v){ window.scrollBy(0, v); moveTouchDrag(); }
  td.raf = requestAnimationFrame(autoScroll);
}
document.addEventListener("touchmove", e => {
  if (!td) return; const t = e.touches[0];
  if (!td.active){ if (Math.hypot(t.clientX - td.x0, t.clientY - td.y0) > 10){ clearTimeout(td.timer); td = null; } return; }
  e.preventDefault(); td.lx = t.clientX; td.ly = t.clientY; moveTouchDrag();
}, {passive:false});
function endTouch(e){
  if (!td) return; clearTimeout(td.timer); const d = td; td = null;
  if (!d.active) return;
  e.preventDefault(); suppressClick = Date.now();
  cancelAnimationFrame(d.raf); d.ghost.remove(); d.card.classList.remove("lifted"); document.body.classList.remove("dragging");
  if (d.over) d.over.classList.remove("drop");
  if (e.type === "touchend" && d.over) moveSession(d.id, d.over.dataset.date);
}
document.addEventListener("touchend", endTouch, {passive:false});
document.addEventListener("touchcancel", endTouch, {passive:false});
document.addEventListener("contextmenu", e => { if (e.target.closest(".card")) e.preventDefault(); });

async function copyWeekFrom(start){

function renderHalf(){
  const a = state.anchor, y = a.getFullYear(), h = a.getMonth() < 6 ? 0 : 1;
  const first = new Date(y, h*6, 1), last = new Date(y, h*6+6, 0);
  $("period").textContent = `${h?"2.":"1."} Halbjahr ${y}`;
  const arr = inRange(iso(first), iso(last)), T = totals(arr);
  $("summary").innerHTML = statsHtml(T, `<div class="stat"><span class="k">Längster Lauf</span><span class="v num">${fmtKm(T.longest)}<small>km</small></span></div>`);

  const weeks = []; let d = sow(first);
  while (d <= last){ const wk = totals(inRange(iso(d), iso(addDays(d,6)))); weeks.push({start:d, ...wk}); d = addDays(d,7); }
  const maxV = Math.max(10, ...weeks.map(w => Math.max(w.planKm, w.doneKm)));
  const step = maxV > 80 ? 20 : maxV > 40 ? 10 : 5, top = Math.ceil(maxV/step)*step;
  const W = 820, H = 260, L = 40, R = 10, Tp = 14, B = 34, cw = (W-L-R)/weeks.length, bw = Math.max(6, cw*0.62);
  const yv = v => Tp + (H-Tp-B) * (1 - v/top);

  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Wochenkilometer geplant und gelaufen">`;
  for (let v=0; v<=top; v+=step){ svg += `<line x1="${L}" x2="${W-R}" y1="${yv(v)}" y2="${yv(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${yv(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="Lato, Helvetica, sans-serif">${v}</text>`; }
  weeks.forEach((w,i) => {
    const x = L + i*cw + (cw-bw)/2, isCur = iso(w.start)===curWk;
    if (w.planKm) svg += `<rect x="${x}" y="${yv(w.planKm)}" width="${bw}" height="${yv(0)-yv(w.planKm)}" rx="2" fill="none" stroke="var(--muted)" stroke-opacity=".6" stroke-dasharray="2 3" stroke-width="1"/>`;
    if (w.doneKm) svg += `<rect x="${x+bw/2-3}" y="${yv(w.doneKm)}" width="6" height="${yv(0)-yv(w.doneKm)}" rx="3" fill="${isCur?"var(--bib)":"var(--accent)"}"><title>KW ${isoWeek(w.start)}: ${fmtKm(w.doneKm)} von ${fmtKm(w.planKm)} km</title></rect>`;
    if (i%2===0 || weeks.length<16) svg += `<text x="${x+bw/2}" y="${H-B+16}" text-anchor="middle" font-size="10.5" fill="var(--muted)" font-family="Lato, Helvetica, sans-serif">${isoWeek(w.start)}</text>`;
    if (isCur) svg += `<text x="${x+bw/2}" y="${H-4}" text-anchor="middle" font-size="9.5" font-weight="700" letter-spacing="1.2" fill="var(--bib)">JETZT</text>`;
  });
  svg += `</svg>`;

  let rows = "";
  const curM = `${today().getFullYear()}-${today().getMonth()}`;
  for (let m=0;m<6;m++){
    const mf = new Date(y, h*6+m, 1), ml = new Date(y, h*6+m+1, 0), mt = totals(inRange(iso(mf), iso(ml)));
    const q = mt.planCount ? Math.round(mt.doneCount/mt.planCount*100)+" %" : "–";
    rows += `<tr class="click ${curM===`${y}-${h*6+m}`?"cur":""}" data-month="${iso(mf)}"><td>${MONTHS[h*6+m]}</td><td>${fmtKm(mt.planKm)}</td><td>${fmtKm(mt.doneKm)}</td><td>${mt.avgPace?fmtPaceSec(mt.avgPace):"–"}</td><td>${mt.doneCount}/${mt.planCount}</td><td>${q}</td></tr>`;
  }
  rows += `<tr><td>Summe</td><td>${fmtKm(T.planKm)}</td><td>${fmtKm(T.doneKm)}</td><td>${T.avgPace?fmtPaceSec(T.avgPace):"–"}</td><td>${T.doneCount}/${T.planCount}</td><td>${T.planCount?Math.round(T.doneCount/T.planCount*100)+" %":"–"}</td></tr>`;

  const byType = {}; arr.filter(s=>s.actual && s.type!=="rest").forEach(s => { byType[s.type] = byType[s.type]||{n:0}; byType[s.type].n++; });
  const tmax = Math.max(1, ...Object.values(byType).map(v=>v.n));
  const tb = Object.keys(TYPES).filter(k=>byType[k]).map(k => `<div class="tb" style="--tc:var(--t-${k})"><span>${TYPES[k].label}</span><span class="bar"><i style="width:${byType[k].n/tmax*100}%"></i></span><span class="n num">${byType[k].n}×</span></div>`).join("") || `<p class="note">Noch keine absolvierten Einheiten in diesem Halbjahr.</p>`;

  $("view").innerHTML = `<div style="display:grid;gap:16px">
    <div class="panel fcpanel"><h2>Formcheck</h2>${formcheckHtml(false)}</div>
    <div class="panel"><h2>Wochenkilometer</h2>
      <div class="legend"><span><i class="sw" style="border:1px dashed var(--muted)"></i>geplant</span><span><i class="sw" style="background:var(--accent)"></i>gelaufen</span><span><i class="sw" style="background:var(--bib)"></i>aktuelle Woche</span></div>
      <div class="chartbox">${svg}</div></div>
    <div class="hgrid">
      <div class="panel"><h2>Monate</h2><div class="tbl"><table><thead><tr><th>Monat</th><th>Plan km</th><th>Gelaufen</th><th>Ø Pace</th><th>Einheiten</th><th>Quote</th></tr></thead><tbody>${rows}</tbody></table></div></div>
      <div class="panel"><h2>Trainingsarten</h2><div class="typebars">${tb}</div></div>
    </div></div>`;
  document.querySelectorAll("tr[data-month]").forEach(r => r.onclick = () => { state.anchor = parse(r.dataset.month); state.view = "month"; render(); });

let xlsxLoading = null;
function loadXLSX(){
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (!xlsxLoading) xlsxLoading = new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "vendor/xlsx.full.min.js";
    s.onload = () => res(window.XLSX); s.onerror = () => { xlsxLoading = null; rej(new Error("load")); };
    document.head.appendChild(s);
  });
  return xlsxLoading;
}
async function exportExcel(){
  const done = list().filter(s => s.actual).sort(byDate);
  if (!done.length){ toast("Noch keine absolvierten Einheiten zum Exportieren"); return; }
  const btn = $("exportBtn"); btn.disabled = true;
  try {
    const XLSX = await loadXLSX();
    const rows = done.map(s => {
      const d = parse(s.date), a = s.actual, pp = planPace(s);
      return {
        "Datum": d, "Wochentag": WD_L[(d.getDay()+6)%7], "KW": isoWeek(d),
        "Art": TYPES[s.type]?.label || s.type, "Titel": s.title || "",
        "Plan Distanz (km)": s.planKm ?? "", "Plan Dauer (min)": planMinutes(s) ?? "", "Plan Zone": s.planZone && ZONES[s.planZone] ? ZONES[s.planZone].label : "", "Plan Pace (min/km)": pp ? fmtPaceSec(pp) : "",
        "Distanz (km)": a.km ?? "", "Zeit (h:mm:ss)": a.sec ? fmtTime(a.sec) : "", "Dauer (min)": a.sec ? Math.round(a.sec/6)/10 : "",
        "Pace (min/km)": a.km && a.sec ? fmtPaceSec(a.sec/a.km) : "", "Ø Puls": a.hr ?? "", "RPE": a.rpe ?? "",
        "Gefühl": a.feel ? FEELS[a.feel-1] : "", "Notiz": a.notes || ""
      };
    });
    const ws = XLSX.utils.json_to_sheet(rows, {cellDates:true, dateNF:"dd.mm.yyyy"});
    ws["!cols"] = [12,12,5,16,26,10,10,14,10,11,12,10,11,8,6,9,36].map(w => ({wch:w}));
    ws["!autofilter"] = {ref: ws["!ref"]};
    // Wochenübersicht
    const wk = new Map();
    list().filter(s => s.type!=="rest").forEach(s => { const k = iso(sow(parse(s.date))); if(!wk.has(k)) wk.set(k,[]); wk.get(k).push(s); });
    const wrows = [...wk.keys()].sort().map(k => { const t = totals(wk.get(k)), d = parse(k);
      return {"KW": isoWeek(d), "Woche ab": d, "Plan km": Math.round(t.planKm*10)/10, "Gelaufen km": Math.round(t.doneKm*100)/100,
        "Einheiten geplant": t.planCount, "Einheiten absolviert": t.doneCount, "Ø Pace (min/km)": t.avgPace ? fmtPaceSec(t.avgPace) : "",
        "Trainingszeit (h:mm)": t.sec ? fmtTime(t.sec).replace(/:\d\d$/,"") : "", "Ø RPE": t.rpe ? Math.round(t.rpe*10)/10 : "" }; });
    const ws2 = XLSX.utils.json_to_sheet(wrows, {cellDates:true, dateNF:"dd.mm.yyyy"});
    ws2["!cols"] = [5,12,9,11,10,12,12,12,7].map(w => ({wch:w}));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Trainings");
    XLSX.utils.book_append_sheet(wb, ws2, "Wochen");
    const out = XLSX.write(wb, {bookType:"xlsx", type:"array"});
    const name = `Trainings_${iso(today())}.xlsx`;
    const ok = await saveFile(new Blob([out], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}), name);
    if (ok) toast(`${done.length} Einheiten exportiert`);
  } catch(e){
    toast(e && e.message === "load" ? "Das Excel-Modul konnte nicht geladen werden. Öffne die App einmal mit Internet." : "Export hat nicht geklappt. Versuch es gleich noch einmal.");
  } finally { btn.disabled = false; }
}
